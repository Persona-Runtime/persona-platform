---
# Kubernetes host 공통 전제와 container runtime·kube 패키지 준비. driver와 Tailscale
# 등록, Join은 하지 않는다. 이 파일에는 token·tailnet auth·Join 정보가 없으므로 재실행해도
# 클러스터 등록 상태를 바꾸지 않는다.
#
# `--check`에 대한 규칙: 상태를 **읽는** task는 `check_mode: false`로 check mode에서도
# 실행하고, 그 결과를 조건으로 삼는 **바꾸는** task는 check mode에서 건너뛰어진다.
# 이렇게 하면 `--check`가 "무엇이 바뀔지"를 실제 host 상태 기준으로 보여 준다. 이전 판은
# 읽기와 쓰기를 모두 `command`로 두어 `--check`가 아무것도 검사하지 못했다.
- name: Prepare base OS prerequisites for one GPU worker
  hosts: gpu_nodes
  gather_facts: true
  become: true
  any_errors_fatal: true

  vars:
    gpu_base_packages:
      - ca-certificates
      - curl
      - gnupg
      - kmod
    gpu_kernel_modules:
      - overlay
      - br_netfilter
    # 실제 값은 클러스터에서 읽어 채운다. 추측한 버전으로 설치하지 않는다 —
    # kubelet이 API server보다 새 minor면 Join이 거부되거나 이후 동작이 보장되지 않는다.
    gpu_kubernetes_minor: ""
    # 설치할 kubeadm·kubelet·kubectl deb package version(예: 1.36.2-1.1). 이 GPU host에 저장소를
    # 등록한 뒤 `apt-cache madison`이 보여 준 값만 넘긴다 — 아래에서 그 목록에 있는지 다시 확인한다.
    # 비어 있으면 목록만 보여 주고 설치하지 않는다.
    gpu_kubernetes_package_version: ""
    # `kubectl version -o json`의 serverVersion.gitVersion(예: v1.36.4). package version을 넘길 때
    # 필수다 — 설치 **전에** package patch ≤ API server patch를 확인한다. 저장소가 더 새 patch만
    # 내놓으면 설치하지 않고 멈춘다(40-join-preflight까지 가서 막으면 이미 설치된 뒤다).
    api_server_version: ""

  tasks:
    - name: Ubuntu 24.04 amd64 대상만 변경 허용
      ansible.builtin.assert:
        that:
          - ansible_facts.distribution == 'Ubuntu'
          - ansible_facts.distribution_major_version == '24'
          - ansible_facts.architecture == 'x86_64'
        fail_msg: >-
          검토하지 않은 OS나 architecture에는 Kubernetes host 설정을 적용하지 않는다.

    - name: Base package 설치
      ansible.builtin.apt:
        name: "{{ gpu_base_packages }}"
        state: present
        update_cache: true

    - name: Kubernetes 네트워크 kernel module을 부팅 후에도 유지
      ansible.builtin.copy:
        dest: /etc/modules-load.d/persona-kubernetes.conf
        owner: root
        group: root
        mode: '0644'
        content: |
          overlay
          br_netfilter

    # 지금 적재된 module 목록을 먼저 읽는다(읽기라서 check mode에서도 돈다).
    - name: 현재 적재된 kernel module 읽기
      ansible.builtin.command:
        cmd: cat /proc/modules
      changed_when: false
      check_mode: false
      register: gpu_loaded_modules

    # 없는 것만 적재한다. 두 번째 실행에서는 조건이 거짓이 되어 아무것도 하지 않는다.
    - name: 빠진 module만 현재 kernel에 적재
      ansible.builtin.command:
        cmd: "modprobe {{ item }}"
      loop: "{{ gpu_kernel_modules }}"
      when: item not in gpu_loaded_modules.stdout
      changed_when: true

    - name: Kubernetes bridge와 forwarding sysctl 선언
      ansible.builtin.copy:
        dest: /etc/sysctl.d/99-persona-kubernetes.conf
        owner: root
        group: root
        mode: '0644'
        content: |
          net.bridge.bridge-nf-call-iptables = 1
          net.bridge.bridge-nf-call-ip6tables = 1
          net.ipv4.ip_forward = 1
      register: gpu_sysctl_file

    # 파일이 바뀐 경우에만 반영한다. 매 실행마다 `sysctl --system`을 돌리면 다른 곳의
    # 설정까지 다시 적용되고, 무엇이 바뀌었는지 기록에서 사라진다.
    - name: 선언이 바뀐 경우에만 sysctl 반영
      ansible.builtin.command:
        cmd: sysctl --system
      when: gpu_sysctl_file.changed
      changed_when: true

    - name: sysctl 실효값 읽기
      ansible.builtin.command:
        cmd: "sh -c 'sysctl -n net.ipv4.ip_forward net.bridge.bridge-nf-call-iptables'"
      changed_when: false
      check_mode: false
      register: gpu_sysctl_effective

    - name: sysctl 실효값이 1인지 확인
      ansible.builtin.assert:
        that:
          - gpu_sysctl_effective.stdout_lines | map('trim') | list == ['1', '1']
        fail_msg: >-
          ip_forward 또는 bridge-nf-call-iptables가 1이 아니다. 파일만 쓰였고 반영되지 않았다.

    # swap이 실제로 켜져 있을 때만 끈다 — 두 번째 실행에서 건너뛰어진다.
    - name: Swap이 켜져 있으면 비활성화
      ansible.builtin.command:
        cmd: swapoff -a
      when: ansible_facts.swaptotal_mb | default(0) > 0
      changed_when: true

    - name: Reboot 뒤에도 swap mount를 막기 위한 fstab 주석 처리
      ansible.builtin.replace:
        path: /etc/fstab
        regexp: '^(?!#)(\S+\s+\S+\s+swap\s+.*)$'
        replace: '# \1'

    - name: Base 변경 뒤 swap 상태 재확인
      ansible.builtin.command:
        cmd: swapon --noheadings
      changed_when: false
      check_mode: false
      register: gpu_host_swap

    - name: Swap이 남아 있지 않은지 확인
      ansible.builtin.assert:
        that:
          - gpu_host_swap.stdout | length == 0
        fail_msg: >-
          swap이 아직 활성 상태다. kubelet은 swap이 있으면 기동을 거부한다.

    # containerd와 kube 패키지는 버전이 확정되기 전에는 설치하지 않는다. 패키지 이름을
    # 추측해 설치하면 API server보다 새 kubelet이 들어와 Join이 거부될 수 있다.
    - name: Kubernetes minor가 주어지지 않으면 kube 패키지 단계를 건너뛴다
      ansible.builtin.debug:
        msg: >-
          gpu_kubernetes_minor가 비어 있어 containerd·kubeadm·kubelet 설치를 건너뛴다.
          API server의 실제 minor를 읽어 `-e gpu_kubernetes_minor=1.36` 형태로 넘긴 뒤 다시
          실행한다. 설치할 patch는 그다음 단계에서 저장소 목록을 보고 고른다.
      when: gpu_kubernetes_minor | length == 0

    - name: containerd 설치
      ansible.builtin.apt:
        name: containerd
        state: present
        update_cache: true
      when: gpu_kubernetes_minor | length > 0

    # kubelet은 systemd cgroup driver를 쓰는 containerd를 전제한다. 기본 설정 파일은
    # SystemdCgroup=false로 생성되므로 그대로 두면 kubelet이 불안정해진다.
    - name: containerd 기본 설정 생성
      ansible.builtin.shell:
        cmd: containerd config default > /etc/containerd/config.toml
        creates: /etc/containerd/config.toml
      when: gpu_kubernetes_minor | length > 0

    - name: containerd를 systemd cgroup driver로 설정
      ansible.builtin.replace:
        path: /etc/containerd/config.toml
        regexp: '^(\s*)SystemdCgroup = false$'
        replace: '\1SystemdCgroup = true'
      when: gpu_kubernetes_minor | length > 0
      notify: Restart containerd

    - name: Kubernetes apt 저장소 키 등록
      ansible.builtin.get_url:
        url: "https://pkgs.k8s.io/core:/stable:/v{{ gpu_kubernetes_minor }}/deb/Release.key"
        dest: /etc/apt/keyrings/kubernetes-apt-keyring.asc
        mode: '0644'
      when: gpu_kubernetes_minor | length > 0

    - name: Kubernetes apt 저장소 등록
      ansible.builtin.apt_repository:
        repo: >-
          deb [signed-by=/etc/apt/keyrings/kubernetes-apt-keyring.asc]
          https://pkgs.k8s.io/core:/stable:/v{{ gpu_kubernetes_minor }}/deb/ /
        filename: kubernetes
        state: present
      when: gpu_kubernetes_minor | length > 0

    # 저장소가 실제로 내놓는 package version을 읽는다(읽기라서 check mode에서도 돈다). check mode
    # 첫 실행에서는 저장소 등록이 건너뛰어지므로 이 목록이 비어 있을 수 있다.
    - name: 등록한 저장소의 kube package version 목록 읽기
      ansible.builtin.shell:
        cmd: apt-get update -qq && apt-cache madison kubeadm kubelet kubectl
      changed_when: false
      check_mode: false
      register: gpu_kube_madison
      when: gpu_kubernetes_minor | length > 0

    - name: package version이 주어지지 않으면 목록만 보여 주고 설치를 건너뛴다
      ansible.builtin.debug:
        msg:
          note: >-
            gpu_kubernetes_package_version이 비어 있어 kubeadm·kubelet·kubectl 설치를 건너뛴다.
            아래 목록에서 API server patch 이하인 값을 골라 `-e gpu_kubernetes_package_version=...`로
            넘긴다(api_server_version도 함께). 이 목록에 없는 값과 API server보다 새 patch는
            받지 않는다.
          apt_cache_madison: "{{ gpu_kube_madison.stdout_lines }}"
      when:
        - gpu_kubernetes_minor | length > 0
        - gpu_kubernetes_package_version | length == 0

    # 형식·minor 검사는 controller의 판정 스크립트가 한다(files/kube_version_gate.py, 테스트 있음).
    # 원격 host가 아니라 controller에서 돌리므로 become을 끈다 — 켜 두면 controller에서 sudo를 시도한다.
    - name: package version을 넘기면 API server version도 필요하다
      ansible.builtin.assert:
        that:
          - api_server_version | length > 0
        fail_msg: >-
          gpu_kubernetes_package_version을 넘길 때는 api_server_version도 넘긴다(예:
          `-e api_server_version=v1.36.4`). API server보다 새 patch를 설치하지 않기 위해서다.
      when:
        - gpu_kubernetes_minor | length > 0
        - gpu_kubernetes_package_version | length > 0

    - name: package version 형식·minor와 API server 대비 patch 검사
      ansible.builtin.command:
        argv:
          - python3
          - "{{ playbook_dir }}/../files/kube_version_gate.py"
          - package
          - --minor
          - "{{ gpu_kubernetes_minor }}"
          - --package-version
          - "{{ gpu_kubernetes_package_version }}"
          - --api-server
          - "{{ api_server_version }}"
      delegate_to: localhost
      become: false
      changed_when: false
      check_mode: false
      # 판정 결과는 다음 assert가 저장소 목록과 함께 보여 주며 멈춘다. 여기서 바로 실패하면
      # 판정 JSON 없이 명령 실패만 남는다.
      failed_when: false
      register: gpu_kube_package_gate
      when:
        - gpu_kubernetes_minor | length > 0
        - gpu_kubernetes_package_version | length > 0

    # madison 줄 형식: "   kubeadm | 1.36.2-1.1 | https://pkgs.k8s.io/... Packages". 세 패키지 모두
    # 같은 version이 저장소에 있어야 한다 — 하나라도 없으면 추측한 값이거나 다른 저장소 값이다.
    # 정규식은 Jinja 문자열 escape 해석에 기대지 않도록 backslash 없이 쓴다(공백은 ' *', 구분자는 '[|]').
    - name: 넘긴 package version이 저장소 목록에 세 패키지 모두 있는지 확인
      ansible.builtin.assert:
        that:
          - gpu_kube_package_gate.rc == 0
          - >-
            gpu_kube_madison.stdout_lines
            | select('search', '^ *' ~ item ~ ' *[|] *' ~ (gpu_kubernetes_package_version | regex_escape) ~ ' *[|]')
            | list | length > 0
        fail_msg: >-
          {{ item }} {{ gpu_kubernetes_package_version }}을 설치할 수 없다.
          판정: {{ gpu_kube_package_gate.stdout }}.
          저장소 목록: {{ gpu_kube_madison.stdout_lines }}
      loop:
        - kubeadm
        - kubelet
        - kubectl
      when:
        - gpu_kubernetes_minor | length > 0
        - gpu_kubernetes_package_version | length > 0

    - name: kubeadm·kubelet·kubectl을 확인한 version으로 고정 설치
      ansible.builtin.apt:
        name:
          - "kubeadm={{ gpu_kubernetes_package_version }}"
          - "kubelet={{ gpu_kubernetes_package_version }}"
          - "kubectl={{ gpu_kubernetes_package_version }}"
        state: present
      when:
        - gpu_kubernetes_minor | length > 0
        - gpu_kubernetes_package_version | length > 0

    # hold를 걸어야 apt 전체 업그레이드가 kubelet을 API server보다 앞서 올리지 않는다.
    - name: kube 패키지 버전 고정
      ansible.builtin.dpkg_selections:
        name: "{{ item }}"
        selection: hold
      loop:
        - kubeadm
        - kubelet
        - kubectl
      when:
        - gpu_kubernetes_minor | length > 0
        - gpu_kubernetes_package_version | length > 0

  handlers:
    - name: Restart containerd
      ansible.builtin.systemd_service:
        name: containerd
        state: restarted
        enabled: true
