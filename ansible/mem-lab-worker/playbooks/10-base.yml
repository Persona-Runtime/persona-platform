---
# Kubernetes host 공통 전제와 container runtime·kube 패키지 준비. Tailscale 등록과 Join은
# 하지 않는다. 이 파일에는 token·tailnet auth·Join 정보가 없으므로 재실행해도 클러스터 등록
# 상태를 바꾸지 않는다.
#
# `--check`에 대한 규칙: 상태를 **읽는** task는 `check_mode: false`로 check mode에서도
# 실행하고, 그 결과를 조건으로 삼는 **바꾸는** task는 check mode에서 건너뛰어진다. 이렇게
# 하면 `--check`가 "무엇이 바뀔지"를 실제 host 상태 기준으로 보여 준다.
- name: Prepare base OS prerequisites for the memory lab worker
  hosts: mem_lab_nodes
  gather_facts: true
  become: true
  any_errors_fatal: true

  vars:
    mem_base_packages:
      - ca-certificates
      - curl
      - gnupg
      - kmod
    mem_kernel_modules:
      - overlay
      - br_netfilter
    # 실제 값은 control plane에서 읽어 채운다. 추측한 버전으로 설치하지 않는다 —
    # kubelet이 API server보다 새로우면 version skew 정책을 위반한다.
    #
    # 저장소 등록용 minor (예: "1.36").
    mem_kubernetes_minor: ""
    # 설치할 apt 패키지 버전 (예: "1.36.4-1.1"). minor만으로는 patch가 저장소의 최신으로
    # 정해지므로, API server patch를 넘지 않는 값을 골라 여기에 넘긴다.
    mem_kubernetes_package_version: ""

  tasks:
    - name: Ubuntu 24.04 amd64 대상만 변경 허용
      ansible.builtin.assert:
        that:
          - ansible_facts.distribution == 'Ubuntu'
          - ansible_facts.distribution_major_version == '24'
          - ansible_facts.architecture == 'x86_64'
        fail_msg: >-
          검토하지 않은 OS나 architecture에는 Kubernetes host 설정을 적용하지 않는다.

    - name: Base package 설치
      ansible.builtin.apt:
        name: "{{ mem_base_packages }}"
        state: present
        update_cache: true

    - name: Kubernetes 네트워크 kernel module을 부팅 후에도 유지
      ansible.builtin.copy:
        dest: /etc/modules-load.d/persona-kubernetes.conf
        owner: root
        group: root
        mode: '0644'
        content: |
          overlay
          br_netfilter

    # 지금 적재된 module 목록을 먼저 읽는다(읽기라서 check mode에서도 돈다).
    - name: 현재 적재된 kernel module 읽기
      ansible.builtin.command:
        cmd: cat /proc/modules
      changed_when: false
      check_mode: false
      register: mem_loaded_modules

    # 없는 것만 적재한다. 두 번째 실행에서는 조건이 거짓이 되어 아무것도 하지 않는다.
    - name: 빠진 module만 현재 kernel에 적재
      ansible.builtin.command:
        cmd: "modprobe {{ item }}"
      loop: "{{ mem_kernel_modules }}"
      when: item not in mem_loaded_modules.stdout
      changed_when: true

    - name: Kubernetes bridge와 forwarding sysctl 선언
      ansible.builtin.copy:
        dest: /etc/sysctl.d/99-persona-kubernetes.conf
        owner: root
        group: root
        mode: '0644'
        content: |
          net.bridge.bridge-nf-call-iptables = 1
          net.bridge.bridge-nf-call-ip6tables = 1
          net.ipv4.ip_forward = 1
      register: mem_sysctl_file

    # ── src_valid_mark를 0으로 고정한다 ─────────────────────────────────────
    #
    # **이 값은 취향이 아니라 측정된 필수 설정이다.** Tailscale은 기동할 때
    # `net.ipv4.conf.all.src_valid_mark`를 1로 켠다(subnet router 동작을 위한 기본값이다).
    # 그런데 Cilium이 L7/DNS 프록시를 쓰면 프록시 패킷에 fwmark 0x200이 붙고, 출발지 검증이
    # 그 mark를 포함해 별도 라우팅 테이블을 조회하면서 Pod 출발지를 로컬 주소로 오인한다.
    # 커널은 그 패킷을 `IP_LOCAL_SOURCE`로 버리는데, **로그도 카운터도 남지 않는다**
    # (cilium/cilium#48706). 증상은 "DNS가 간헐적으로 안 된다"로만 보인다.
    #
    # 홈 3노드는 이미 0으로 고정돼 있고, 이 노드도 같은 tailnet·같은 Cilium 위에 붙으므로
    # 같은 값을 쓴다. 아래 파일은 **부팅 시점 값**을 담당한다. tailscaled가 기동 뒤에 다시
    # 1로 켜는 것은 이 파일로 막을 수 없으므로 20-tailscale이 unit drop-in으로 처리한다 —
    # 두 장치가 각각 다른 시점을 맡는다.
    - name: Cilium 프록시 경로를 위해 src_valid_mark를 0으로 선언
      ansible.builtin.copy:
        dest: /etc/sysctl.d/99-cilium-srcmark.conf
        owner: root
        group: root
        mode: '0644'
        content: |
          # Tailscale이 1로 켜면 Cilium DNS 프록시 패킷이 IP_LOCAL_SOURCE로 조용히 버려진다.
          # cilium/cilium#48706. 부팅 시점 값이며, tailscaled 기동 후 재적용은
          # /etc/systemd/system/tailscaled.service.d/가 담당한다.
          net.ipv4.conf.all.src_valid_mark = 0
      register: mem_srcmark_file

    # 파일이 바뀐 경우에만 반영한다. 매 실행마다 `sysctl --system`을 돌리면 다른 곳의
    # 설정까지 다시 적용되고, 무엇이 바뀌었는지 기록에서 사라진다.
    - name: 선언이 바뀐 경우에만 sysctl 반영
      ansible.builtin.command:
        cmd: sysctl --system
      when: mem_sysctl_file.changed or mem_srcmark_file.changed
      changed_when: true

    - name: sysctl 실효값 읽기
      ansible.builtin.command:
        cmd: "sh -c 'sysctl -n net.ipv4.ip_forward net.bridge.bridge-nf-call-iptables net.ipv4.conf.all.src_valid_mark'"
      changed_when: false
      check_mode: false
      register: mem_sysctl_effective

    # 파일이 쓰였다는 것과 커널에 반영됐다는 것은 다르다. 실효값으로 판정한다.
    - name: sysctl 실효값 확인 (src_valid_mark는 0이어야 한다)
      ansible.builtin.assert:
        that:
          - mem_sysctl_effective.stdout_lines | map('trim') | list == ['1', '1', '0']
        fail_msg: >-
          ip_forward/bridge-nf-call-iptables/src_valid_mark 실효값이
          {{ mem_sysctl_effective.stdout_lines | map('trim') | list }}로 기대값
          ['1', '1', '0']과 다르다. 파일만 쓰였고 반영되지 않았거나, 다른 선언이 뒤에서
          덮어쓰고 있다. /etc/sysctl.d의 파일 순서를 확인한다.

    # swap이 실제로 켜져 있을 때만 끈다 — 두 번째 실행에서 건너뛰어진다.
    #
    # 이 실험에서 swap이 특히 중요하다: swap이 켜져 있으면 메모리 압박이 축출이 아니라
    # 스왑으로 흡수되어 MemoryPressure가 늦게 오거나 오지 않는다. 축출 순서를 보려면 꺼야 한다.
    - name: Swap이 켜져 있으면 비활성화
      ansible.builtin.command:
        cmd: swapoff -a
      when: ansible_facts.swaptotal_mb | default(0) > 0
      changed_when: true

    - name: Reboot 뒤에도 swap mount를 막기 위한 fstab 주석 처리
      ansible.builtin.replace:
        path: /etc/fstab
        regexp: '^(?!#)(\S+\s+\S+\s+swap\s+.*)$'
        replace: '# \1'

    - name: Base 변경 뒤 swap 상태 재확인
      ansible.builtin.command:
        cmd: swapon --noheadings
      changed_when: false
      check_mode: false
      register: mem_host_swap

    - name: Swap이 남아 있지 않은지 확인
      ansible.builtin.assert:
        that:
          - mem_host_swap.stdout | length == 0
        fail_msg: >-
          swap이 아직 활성 상태다. kubelet은 swap이 있으면 기동을 거부하고, 남아 있으면
          메모리 압박이 축출 대신 스왑으로 흡수되어 실험 결과가 달라진다.

    # containerd와 kube 패키지는 버전이 확정되기 전에는 설치하지 않는다. 패키지 이름을
    # 추측해 설치하면 CP보다 새 kubelet이 들어와 Join이 거부될 수 있다.
    - name: control plane 버전이 주어지지 않으면 kube 패키지 단계를 건너뛴다
      ansible.builtin.debug:
        msg: >-
          mem_kubernetes_minor가 비어 있어 containerd·kubeadm·kubelet 설치를 건너뛴다.
          control plane의 실제 minor를 읽어 `-e mem_kubernetes_minor=1.36` 형태로 넘긴 뒤
          다시 실행한다.
      when: mem_kubernetes_minor | length == 0

    - name: containerd 설치
      ansible.builtin.apt:
        name: containerd
        state: present
        update_cache: true
      when: mem_kubernetes_minor | length > 0

    # kubelet은 systemd cgroup driver를 쓰는 containerd를 전제한다. 기본 설정 파일은
    # SystemdCgroup=false로 생성되므로 그대로 두면 kubelet이 불안정해진다.
    - name: containerd 기본 설정 생성
      ansible.builtin.shell:
        cmd: containerd config default > /etc/containerd/config.toml
        creates: /etc/containerd/config.toml
      when: mem_kubernetes_minor | length > 0

    - name: containerd를 systemd cgroup driver로 설정
      ansible.builtin.replace:
        path: /etc/containerd/config.toml
        regexp: '^(\s*)SystemdCgroup = false$'
        replace: '\1SystemdCgroup = true'
      when: mem_kubernetes_minor | length > 0
      notify: Restart containerd

    - name: Kubernetes apt 저장소 키 등록
      ansible.builtin.get_url:
        url: "https://pkgs.k8s.io/core:/stable:/v{{ mem_kubernetes_minor }}/deb/Release.key"
        dest: /etc/apt/keyrings/kubernetes-apt-keyring.asc
        mode: '0644'
      when: mem_kubernetes_minor | length > 0

    - name: Kubernetes apt 저장소 등록
      ansible.builtin.apt_repository:
        repo: >-
          deb [signed-by=/etc/apt/keyrings/kubernetes-apt-keyring.asc]
          https://pkgs.k8s.io/core:/stable:/v{{ mem_kubernetes_minor }}/deb/ /
        filename: kubernetes
        state: present
      when: mem_kubernetes_minor | length > 0

    # ── patch까지 고정해 설치한다 ───────────────────────────────────────────
    #
    # 버전을 고정하지 않으면 저장소의 **최신 patch**가 들어온다. 그것이 API server patch보다
    # 새로우면 kubelet version skew 정책을 위반하고, 40-join-preflight의 버전 게이트가 바로
    # 그 상태를 거부한다. 즉 고정하지 않는 것은 "설치는 성공하고 Join 전에 막히는" 함정이다.
    #
    # 값을 추측하지 않는다. 요청한 버전이 저장소에 실제로 있는지 먼저 읽고, 없으면 apt의
    # 불투명한 오류 대신 어떤 값이 있는지 함께 보여 준다.
    - name: 요청한 kube 패키지 버전이 저장소에 있는지 읽기
      ansible.builtin.command:
        cmd: apt-cache madison kubelet
      changed_when: false
      check_mode: false
      register: mem_kube_madison
      when:
        - mem_kubernetes_minor | length > 0
        - mem_kubernetes_package_version | length > 0

    # 구분자까지 포함해 대조한다. 부분 문자열로 보면 `1.36.4-1.1`이 `1.36.41-1.1`에도
    # 걸리는 종류의 오판이 생긴다(40-join-preflight의 버전 게이트가 같은 이유로 고쳐졌다).
    - name: 요청한 버전이 저장소 목록에 있는지 단정
      ansible.builtin.assert:
        that:
          - mem_kube_madison.stdout is search('\|\s*' ~ (mem_kubernetes_package_version | regex_escape) ~ '\s*\|')
        fail_msg: >-
          요청한 kube 패키지 버전({{ mem_kubernetes_package_version }})이 저장소에 없다.
          사용할 수 있는 값: {{ mem_kube_madison.stdout_lines | default([]) }}
      when:
        - mem_kubernetes_minor | length > 0
        - mem_kubernetes_package_version | length > 0

    - name: kubeadm·kubelet·kubectl 설치 (patch 고정)
      ansible.builtin.apt:
        name:
          - "kubeadm={{ mem_kubernetes_package_version }}"
          - "kubelet={{ mem_kubernetes_package_version }}"
          - "kubectl={{ mem_kubernetes_package_version }}"
        state: present
        update_cache: true
      when:
        - mem_kubernetes_minor | length > 0
        - mem_kubernetes_package_version | length > 0

    - name: 버전을 고정하지 않으면 최신 patch가 들어온다는 것을 알린다
      ansible.builtin.debug:
        msg: >-
          mem_kubernetes_package_version이 비어 있어 kube 패키지를 설치하지 않는다. 고정하지
          않고 설치하면 저장소의 최신 patch가 들어오고, 그것이 API server patch보다 새로우면
          40-join-preflight의 버전 게이트가 거부한다. CP에서 API server 버전을 읽고
          `apt-cache madison kubelet`에서 그에 맞는 값을 골라
          `-e mem_kubernetes_package_version=1.36.4-1.1` 형태로 넘긴다.
      when:
        - mem_kubernetes_minor | length > 0
        - mem_kubernetes_package_version | length == 0

    # hold를 걸어야 apt 전체 업그레이드가 kubelet을 API server보다 앞서 올리지 않는다.
    # 설치가 실제로 일어난 경우에만 건다 — 설치하지 않은 패키지에 hold를 걸면 이후 설치가
    # 조용히 막히고, 그 원인을 여기서 찾기 어렵다.
    - name: kube 패키지 버전 고정
      ansible.builtin.dpkg_selections:
        name: "{{ item }}"
        selection: hold
      loop:
        - kubeadm
        - kubelet
        - kubectl
      when:
        - mem_kubernetes_minor | length > 0
        - mem_kubernetes_package_version | length > 0

  handlers:
    - name: Restart containerd
      ansible.builtin.systemd_service:
        name: containerd
        state: restarted
        enabled: true
