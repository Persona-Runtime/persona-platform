# MetalLB 컨트롤러·CRD 설치. 이 Application을 먼저 Sync해야 metallb-config.yaml의
# IPAddressPool·L2Advertisement가 적용된다(CRD 선행 필요) — README 배치 순서 참고.
#
# 수동 Sync. CreateNamespace만 syncOptions로 허용하고 자동 Sync는 켜지 않는다.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: metallb
  namespace: argocd
spec:
  project: default
  sources:
    - repoURL: https://metallb.github.io/metallb
      chart: metallb
      targetRevision: 0.16.1
      helm:
        releaseName: metallb
        valueFiles:
          - $values/helm/values/metallb.yaml
    - repoURL: https://github.com/Persona-Runtime/persona-platform.git
      targetRevision: develop
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: metallb-system
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
