# 인터넷 진입 전용(httproute-public.yaml + Middleware 4개: oauth-forward·rate-limit·
# security-headers·body-limit). Sync 통제(2026-09-19)로 persona-app(워크로드·내부 경로)
# 에서 분리했다 — argocd/README.md 참고.
#
# 선행 조건: Traefik이 kubernetesCRD 프로바이더를 켠 뒤(bootstrap/traefik/values.yaml)
# Sync한다 — Middleware를 ExtensionRef로 참조하는 HTTPRoute라 그 프로바이더가 없으면
# 거부된다. Secret persona-app-tls(cert-manager 발급)·oauth2-proxy Service·ReferenceGrant도
# 먼저 있어야 한다(scripts/argo-preflight.sh persona-app-ingress로 확인).
#
# syncPolicy를 두지 않는다. 수동 Sync 기준.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: persona-app-ingress
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: persona-platform
    app.kubernetes.io/component: application
spec:
  project: default
  source:
    repoURL: https://github.com/Persona-Runtime/persona-platform.git
    targetRevision: develop
    path: kustomize/overlays/prod/persona-app-ingress
  destination:
    server: https://kubernetes.default.svc
    namespace: persona-app
