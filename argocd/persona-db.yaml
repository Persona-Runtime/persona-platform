# 1단계: DB. 이 Application을 Sync하기 전에 CNPG operator가 설치돼 있어야 한다
# (bootstrap/cnpg/README.md). CRD가 없으면 Sync가 실패한다.
#
# syncPolicy를 두지 않는다. 자동 Sync도, 자동 prune도 없다. DB는 사람이 상태를 보고
# 올리는 대상이다.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: persona-db
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: persona-platform
    app.kubernetes.io/component: database
spec:
  project: default
  source:
    repoURL: https://github.com/Persona-Runtime/persona-platform.git
    targetRevision: develop
    path: kustomize/overlays/prod/persona-db
  destination:
    server: https://kubernetes.default.svc
    namespace: persona-data
