# Cilium — persona-runtime 홈 클러스터
# 설치: helm install cilium cilium/cilium --version 1.20.1 -n kube-system -f values.yaml

cluster:
  name: persona-runtime

# --- kube-proxy 유지 ---
# 변수를 하나씩만 바꾼다. CNI와 kube-proxy를 동시에 바꾸면 K8S-01의 원인 분리가 불가능해진다.
# Cilium의 Gateway API 기능이 kubeProxyReplacement를 요구하므로, 이 값이 false인 한
# Gateway API는 Traefik이 단독으로 소유한다.
kubeProxyReplacement: false

# --- 라우팅과 MTU ---
routingMode: tunnel
tunnelProtocol: vxlan

# MTU (실측으로 확정)
#   tailscale0 = 1280  ·  LAN = 1500  ·  VXLAN 오버헤드 = 50 bytes
#
#   이 값은 **underlay 기준값**이다. Cilium은 인터페이스에는 이 값을 그대로 쓰고,
#   파드 netns의 라우트에는 여기서 터널 오버헤드를 뺀 값을 넣는다.
#   실효 경로 MTU는 라우트 값이므로, 검증은 반드시 `ip route get`으로 한다.
#
#     MTU: 1280 → eth0 1280 / route 1230 → 캡슐화 후 1280 → tailscale0에 정확히 맞음
#
#   자동 감지에 맡기면 LAN 기준 1500으로 잡혀 캡슐화 후 1500이 되고,
#   AWS 워커가 조인하는 순간 tailscale0(1280)을 넘는 패킷이 조용히 사라진다.
#   K8S-01은 이 정상 기준선에서 변수 하나만 바꾸는 방식으로 설계한다.
MTU: 1280

# MTU 등 ConfigMap에만 반영되는 값은 helm upgrade로 파드가 재시작되지 않는다.
# 이 옵션이 pod template에 체크섬을 넣어 자동 재시작시킨다.
# 다만 helm은 알 수 없는 값을 조용히 무시하므로, 이것에만 의존하지 말고
# 설정 변경 후에는 항상 실제 인터페이스 MTU를 확인한다 (README 참고).
rollOutCiliumPods: true

# --- IPAM ---
# kubeadm이 노드에 할당한 spec.podCIDR을 그대로 사용한다.
# 진실의 출처를 하나로 두어 디버깅 시 kubectl 값과 실제가 어긋나지 않게 한다.
ipam:
  mode: kubernetes

# --- Gateway API / Ingress: Traefik이 소유한다 ---
gatewayAPI:
  enabled: false
ingressController:
  enabled: false

# --- Hubble: K8S-01의 핵심 도구 ---
# 드롭 이유 라벨과 흐름 관측이 없으면 MTU 원인 확정이 추측이 된다.
hubble:
  enabled: true
  relay:
    enabled: true
  ui:
    enabled: true
  metrics:
    enabled:
      - dns
      - drop
      - tcp
      - flow
      - icmp

# --- 메트릭 노출 (Prometheus는 아직 미설치) ---
# serviceMonitor는 Prometheus Operator 설치 후에 켠다. 지금 켜면 CRD가 없어 실패한다.
prometheus:
  enabled: true
operator:
  prometheus:
    enabled: true
  # 워커 2대 환경에서 replica 2는 과하다.
  replicas: 1
