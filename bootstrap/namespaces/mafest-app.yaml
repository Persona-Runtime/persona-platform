# mafest 앱 계층 namespace(API·웹·적재 Job). DB(mafest-data)와 분리해 앱 정리가 데이터 삭제로
# 번지지 않게 한다. 적재 Job(kustomize/overlays/prod/mafest-load)도 여기서 돈다.
# Argo Application·Job overlay에는 Namespace를 넣지 않는다 — 이 파일이 소유한다.
apiVersion: v1
kind: Namespace
metadata:
  name: mafest-app
  labels:
    app.kubernetes.io/part-of: persona-platform
    app.kubernetes.io/component: application
