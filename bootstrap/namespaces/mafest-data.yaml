# mafest 데이터 계층 namespace(CNPG Cluster mafest-db). 앱(mafest-app)과 분리해 삭제·prune 범위를 가른다.
# 앱 Application을 지우거나 되돌려도 DB와 PVC가 따라서 지워지지 않는다.
# Argo Application(mafest-db·mafest-db-netpol)에는 Namespace를 넣지 않는다 — 이 파일이 소유한다.
apiVersion: v1
kind: Namespace
metadata:
  name: mafest-data
  labels:
    app.kubernetes.io/part-of: persona-platform
    app.kubernetes.io/component: data
