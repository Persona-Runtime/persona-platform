# vLLM만 사는 namespace. persona-app과 분리한 이유는 폭발 반경이다 — vLLM은 모델 가중치와
# GPU를 쥐고 있고, Gateway와 같은 namespace에 두면 default-deny 안에서 서로 자유롭게
# 통신하게 되어 "Gateway만 vLLM을 부를 수 있다"를 정책으로 표현할 수 없다.
#
# **아직 적용하지 않았다.** 이 파일을 가리키는 Argo Application이 없다. GPU 노드가 조인하고
# vLLM 배포가 승인된 뒤에 적용한다.
#
# Pod Security Admission 라벨을 붙이지 않았다. 이 저장소의 다른 namespace 어디에도
# pod-security.kubernetes.io/* 라벨이 없어서, 여기만 `restricted`로 두면 새 관례가 하나
# 생긴다. 그리고 vLLM 컨테이너가 non-root·read-only rootfs·capability drop을 실제로 견디는지
# 확인한 적이 없다 — 확인 전에 `restricted`를 걸면 Pod가 기동하지 못하는 원인이 정책인지
# 이미지인지 구분하기 어려워진다. 실제 배포 직전에 vLLM Pod의 securityContext를 먼저 정하고,
# 그때 이 namespace와 기존 namespace에 같은 관례를 함께 적용한다.
apiVersion: v1
kind: Namespace
metadata:
  name: persona-inference
  labels:
    app.kubernetes.io/part-of: persona-platform
    app.kubernetes.io/component: inference
