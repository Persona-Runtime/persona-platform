# 과거 설계 참고용 — 2026-09-11 결정으로 기본 설치·서비스 선언에서 사용하지 않는다.
# 추후 자원 압박 실험에서 재검토한다. 기존 클러스터의 클래스 삭제나 선점 전역 해제는 하지 않는다.
# 우선순위는 생존 보장이 아니며, 현재 미적용 정의를 일괄 apply하지 않는다.
apiVersion: scheduling.k8s.io/v1
kind: PriorityClass
metadata:
  name: persona-critical
value: 1000000
globalDefault: false
description: "미적용 실험 후보: 관측·데이터의 상대 우선순위. 생존 보장 아님."
---
apiVersion: scheduling.k8s.io/v1
kind: PriorityClass
metadata:
  name: persona-standard
value: 1000
globalDefault: false
description: "미적용 실험 후보: 운영 도구의 상대 우선순위."
---
apiVersion: scheduling.k8s.io/v1
kind: PriorityClass
metadata:
  name: persona-low
value: 100
globalDefault: false
description: "미적용 실험 후보: stateless의 상대 우선순위. 클래스 없는 Pod보다 높을 수 있음."
