# Traefik 41.4.0 (Traefik v3.7.12) — Gateway API 컨트롤러
# 스키마 검사 통과만으로 설정 반영을 보장하지 않는다. 렌더 결과와 실제 Deployment를 확인한다.

# 홈 서버에서 적용·확인한 목표 배치. 근거: ../../../tradeoff/07-service-replicas.md
# 기존 Helm 값에 hostname 고정이 있으면 빈 맵을 병합하는 것만으로 제거되지 않을 수 있다.
# README의 마이그레이션 기록을 확인한다.
nodeSelector: {}

deployment:
  replicas: 2

affinity:
  nodeAffinity:
    requiredDuringSchedulingIgnoredDuringExecution:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values:
                - k8s-worker1
                - k8s-worker2
  podAntiAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        podAffinityTerm:
          topologyKey: kubernetes.io/hostname
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: traefik
              app.kubernetes.io/instance: traefik-traefik

# public inbound 0 원칙. NodePort/LoadBalancer 금지.
# Tailnet 노출은 tailscale serve가 노드에서 ClusterIP로 전달하는 방식으로 붙인다.
#
# 주의: 41.x에서 타입은 service.spec.type 이다. service.type 은 존재하지 않는 키인데,
# service 섹션에 additionalProperties:false 가 없어 스키마를 통과한 뒤 무시된다.
# LoadBalancer로 두면 컨트롤러가 없어 EXTERNAL-IP는 pending이지만 NodePort가 함께
# 할당되어 모든 노드에 포트가 열린다. 이전 클러스터의 ingress-nginx 상태로 되돌아간다.
service:
  spec:
    type: ClusterIP

providers:
  kubernetesGateway:
    enabled: true
  kubernetesCRD:
    enabled: false
  kubernetesIngress:
    enabled: false

# 기본 Gateway 리소스는 차트가 만들지 않는다 — 우리가 선언하고 버전관리한다.
gateway:
  enabled: false

# GatewayClass는 별도 키다. 이것이 있어야 Traefik이 Gateway API 컨트롤러로 동작한다.
gatewayClass:
  enabled: true

# Gateway API만 사용하므로 IngressClass는 만들지 않는다.
ingressClass:
  enabled: false

# 커스텀 우선순위 튜닝은 측정 뒤로 미룬다. 실제 Helm 적용은 별도 승인 후 진행한다.
priorityClassName: ""

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    memory: 256Mi

# log / accessLog 는 하위 키 구조를 확인한 뒤 추가한다:
#   helm show values traefik/traefik --version 41.4.0 | sed -n '/^log:/,/^metrics:/p'
