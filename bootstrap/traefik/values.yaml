# Traefik 41.4.0 (Traefik v3.7.12) — Gateway API 컨트롤러
# 스키마 검사 통과만으로 설정 반영을 보장하지 않는다. 렌더 결과와 실제 Deployment를 확인한다.

# 홈 서버에서 적용·확인한 목표 배치. 근거: ../../../tradeoff/07-service-replicas.md
# 기존 Helm 값에 hostname 고정이 있으면 빈 맵을 병합하는 것만으로 제거되지 않을 수 있다.
# README의 마이그레이션 기록을 확인한다.
nodeSelector: {}

deployment:
  replicas: 2

affinity:
  nodeAffinity:
    requiredDuringSchedulingIgnoredDuringExecution:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values:
                - k8s-worker1
                - k8s-worker2
  podAntiAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        podAffinityTerm:
          topologyKey: kubernetes.io/hostname
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: traefik
              app.kubernetes.io/instance: traefik-traefik

# 2026-09-17 공개 진입 결정: MetalLB가 있는 LoadBalancer만 허용, NodePort 할당은 off.
# 이전의 "public inbound 0 원칙, NodePort/LoadBalancer 금지"는 여기서 뒤집힌다 — 공유기가
# 443 하나만 192.168.50.240으로 포워딩하고, 나머지 인바운드는 계속 0이다(tradeoff 05 참고).
# Tailnet 노출은 그대로 tailscale serve가 노드에서 ClusterIP/LoadBalancer로 전달하는 방식이다.
#
# 주의: 41.x에서 타입은 service.spec.type 이다. service.type 은 존재하지 않는 키인데,
# service 섹션에 additionalProperties:false 가 없어 스키마를 통과한 뒤 무시된다.
#
# MetalLB가 없는 상태에서 LoadBalancer로 두면 EXTERNAL-IP는 pending이지만 NodePort가 함께
# 할당되어 모든 노드에 포트가 열린다. allocateLoadBalancerNodePorts: false로 그 자동 NodePort
# 할당을 막는다 — MetalLB VIP 하나만 열리고 이전 ingress-nginx NodePort 상태로 돌아가지 않는다.
service:
  spec:
    type: LoadBalancer
    allocateLoadBalancerNodePorts: false
    # L2는 어차피 노드 한 대가 받는다. Local이어야 클라이언트 IP가 보존돼 Gate 4의 rate limit이
    # 의미 있다. MetalLB는 Ready 엔드포인트가 있는 노드에서만 announce하므로 failover가
    # Pod를 따라간다(externalTrafficPolicy: Cluster였다면 클라이언트 IP가 SNAT으로 사라진다).
    externalTrafficPolicy: Local
  annotations:
    # loadBalancerIP 필드는 deprecated라 쓰지 않는다.
    metallb.io/loadBalancerIPs: "192.168.50.240"
    metallb.io/address-pool: traefik-pool

ports:
  websecure:
    port: 8443
    exposedPort: 443
  # web(80)은 유지한다 — VIP의 80은 LAN 전용이다. 공유기는 443만 포워딩한다.

providers:
  kubernetesGateway:
    enabled: true
  kubernetesCRD:
    enabled: false
  kubernetesIngress:
    enabled: false

# 기본 Gateway 리소스는 차트가 만들지 않는다 — 우리가 선언하고 버전관리한다.
gateway:
  enabled: false

# GatewayClass는 별도 키다. 이것이 있어야 Traefik이 Gateway API 컨트롤러로 동작한다.
gatewayClass:
  enabled: true

# Gateway API만 사용하므로 IngressClass는 만들지 않는다.
ingressClass:
  enabled: false

# 커스텀 우선순위 튜닝은 측정 뒤로 미룬다. 실제 Helm 적용은 별도 승인 후 진행한다.
priorityClassName: ""

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    memory: 256Mi

# log / accessLog 는 하위 키 구조를 확인한 뒤 추가한다:
#   helm show values traefik/traefik --version 41.4.0 | sed -n '/^log:/,/^metrics:/p'
