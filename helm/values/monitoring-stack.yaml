# kube-prometheus-stack 89.2.0 — H1 최소 모니터링
# 실제 배포는 Argo CD Application의 수동 Sync로만 수행한다.

crds:
  enabled: true

# H1은 외부 알림 전송을 다루지 않는다.
alertmanager:
  enabled: false

# 현재 홈 클러스터는 Linux 노드만 사용한다.
windowsMonitoring:
  enabled: false

# H1에서는 localhost 전용 메트릭을 외부에 열지 않는다.
# 이 옵션들은 차트의 수집 리소스만 제거하며 K8s 컴포넌트를 중지하지 않는다.
kubeControllerManager:
  enabled: false
kubeScheduler:
  enabled: false
kubeEtcd:
  enabled: false
kubeProxy:
  enabled: false

# 미수집 대상에 의존하는 기본 알림·recording rule도 함께 보류한다.
defaultRules:
  rules:
    etcd: false
    kubeControllerManager: false
    kubeProxy: false
    kubeSchedulerAlerting: false
    kubeSchedulerRecording: false

grafana:
  enabled: true
  replicas: 1
  # 이 Secret은 Git에 두지 않고 수동 bootstrap으로 준비한다.
  # admin-user / admin-password 키를 고정해 Helm 난수 렌더를 막는다.
  admin:
    existingSecret: monitoring-grafana-admin
    userKey: admin-user
    passwordKey: admin-password
  persistence:
    enabled: false
  # 이미지 태그를 chart 기본값에 맡기지 않고 여기서 고정한다. 값은 chart 89.2.0의
  # 기본값과 같다(grafana subchart 13.2.0, appVersion 13.2.1). 태그는 digest가 아니라
  # 같은 태그로 다른 이미지가 올 수 있다 — 완전한 불변 식별자는 아니다.
  image:
    tag: 13.2.1-distroless
  # 플러그인 런타임 설치(grafana.plugins → GF_PLUGINS_PREINSTALL_SYNC)는 선언하지 않는다.
  # 13.2.1-distroless에서 이 설치가 이미지 안의 bundled Prometheus 플러그인을 업데이트하려다
  # 읽기 전용 bundled 경로와 충돌해 CrashLoop를 일으켰다(as_external 설정 후에도 같았다).
  # 별도 검증 전에는 사용하지 않는다.
  #
  # Grafana 13.2.1-distroless의 기본 자동 업데이트는 bundled plugin을 읽기 전용 이미지
  # 경로에서 갱신하려다 실패한다. 이미 이미지에 들어 있는 plugin을 쓰고, 별도 검증 전에는
  # Pod 기동 시 업데이트하지 않는다.
  grafana.ini:
    plugins:
      preinstall_auto_update: false
  ingress:
    enabled: false
  service:
    type: ClusterIP
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 250m
      memory: 512Mi
  sidecar:
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 100m
        memory: 128Mi
  affinity: &home_workers
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
          - matchExpressions:
              - key: kubernetes.io/hostname
                operator: In
                values:
                  - k8s-worker1
                  - k8s-worker2

kubeStateMetrics:
  enabled: true

kube-state-metrics:
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 250m
      memory: 256Mi
  affinity: *home_workers

nodeExporter:
  enabled: true

# 현재 H1의 대상은 CP와 두 홈 워커뿐이다. 향후 GPU 노드 조인 시에는
# 별도 검토로 이 affinity를 확장한다.
prometheus-node-exporter:
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 100m
      memory: 128Mi
  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
          - matchExpressions:
              - key: kubernetes.io/hostname
                operator: In
                values:
                  - k8s-cp
                  - k8s-worker1
                  - k8s-worker2

prometheusOperator:
  enabled: true
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
  affinity: *home_workers
  prometheusConfigReloader:
    resources:
      requests:
        cpu: 50m
        memory: 50Mi
      limits:
        cpu: 100m
        memory: 100Mi
  admissionWebhooks:
    patch:
      resources:
        requests:
          cpu: 50m
          memory: 64Mi
        limits:
          cpu: 100m
          memory: 128Mi

prometheus:
  enabled: true
  service:
    type: ClusterIP
  prometheusSpec:
    replicas: 1
    scrapeInterval: 15s
    retention: 7d
    retentionSize: 15GB
    nodeSelector:
      kubernetes.io/hostname: k8s-worker2
    resources:
      requests:
        cpu: 250m
        memory: 1Gi
      limits:
        cpu: "1"
        memory: 2Gi
    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: local-path
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: 20Gi
