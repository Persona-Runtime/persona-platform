# ZONE_ID·RECORD_NAME은 비밀이 아니다(Cloudflare Zone ID는 도메인 개요 페이지에 공개로 뜬다).
# 토큰(CF_API_TOKEN)만 Secret cloudflare-dns-token으로 분리한다.
apiVersion: v1
kind: ConfigMap
metadata:
  name: ddns-config
data:
  ZONE_ID: ZONE_ID_PLACEHOLDER
  RECORD_NAME: app.personaruntime.xyz
  # curlimages/curl에는 jq가 없다(feedback.md가 이 이미지를 digest로 고정하라고 지시했고,
  # 이미지에 도구를 추가로 심지 않는다). Cloudflare 응답의 "id"·"content" 필드를 grep+cut으로
  # 뽑는다 — 이 스크립트가 기대하는 응답 모양(zones/.../dns_records?type=A&name=...)이 바뀌면
  # 같이 깨진다는 뜻이다.
  update-dns.sh: |
    #!/bin/sh
    set -eu

    : "${ZONE_ID:?ZONE_ID가 없다}"
    : "${RECORD_NAME:?RECORD_NAME이 없다}"
    : "${CF_API_TOKEN:?CF_API_TOKEN이 없다}"

    CURL_TIMEOUT_SECONDS=10
    API_BASE="https://api.cloudflare.com/client/v4"

    # 공인 IP는 제3자 없이 Cloudflare 자체 엔드포인트로 조회한다.
    trace=$(timeout "$CURL_TIMEOUT_SECONDS" curl -sS --max-time "$CURL_TIMEOUT_SECONDS" \
      https://1.1.1.1/cdn-cgi/trace) || { echo "공인 IP 조회 실패" >&2; exit 1; }
    current_ip=$(printf '%s\n' "$trace" | grep '^ip=' | cut -d= -f2)
    if [ -z "$current_ip" ]; then
      echo "공인 IP 파싱 실패" >&2
      exit 1
    fi

    # 현재 DNS 레코드 조회. 응답 본문 전체는 로그에 남기지 않는다(토큰은 헤더에만 있고
    # 본문엔 없지만, 습관적으로 원본 응답을 그대로 echo하지 않는다).
    record_json=$(timeout "$CURL_TIMEOUT_SECONDS" curl -sS --max-time "$CURL_TIMEOUT_SECONDS" \
      -H "Authorization: Bearer ${CF_API_TOKEN}" \
      -H "Content-Type: application/json" \
      "${API_BASE}/zones/${ZONE_ID}/dns_records?type=A&name=${RECORD_NAME}") || {
        echo "DNS 레코드 조회 실패" >&2
        exit 1
      }

    case "$record_json" in
      *'"success":true'*) : ;;
      *) echo "DNS 레코드 조회 응답이 실패다" >&2; exit 1 ;;
    esac

    # id·content를 응답 안의 첫 매치로 뽑는다(jq가 없어 grep+cut). 이건 오늘 Cloudflare가
    # id를 다른 "*_id" 필드보다 먼저 두는 응답 순서에 기댄다 — 순서가 바뀌면 조용히 엉뚱한
    # id를 PATCH할 수 있으므로, 뽑은 값이 실제로 이 레코드의 것인지 아래 두 검사로 확인한다.
    record_id=$(printf '%s\n' "$record_json" | grep -o '"id":"[^"]*"' | head -n1 | cut -d'"' -f4)
    record_ip=$(printf '%s\n' "$record_json" | grep -o '"content":"[^"]*"' | head -n1 | cut -d'"' -f4)
    if [ -z "$record_id" ] || [ -z "$record_ip" ]; then
      echo "대상 A 레코드를 찾지 못했다 — 레코드를 먼저 만들어야 한다(Gate 3-3a)" >&2
      exit 1
    fi

    # 검사 1: 응답에 대상 레코드 이름이 실제로 있는지(엉뚱한 레코드의 id를 뽑았다면 여기서 걸린다).
    case "$record_json" in
      *"\"name\":\"${RECORD_NAME}\""*) : ;;
      *) echo "DNS 레코드 응답에 대상 이름이 없다" >&2; exit 1 ;;
    esac

    # 검사 2: Cloudflare 리소스 id는 32자리 hex다. 형식이 다르면 파싱이 엉뚱한 값을 잡은 것이다.
    if [ "$(expr "$record_id" : '[0-9a-f]\{32\}$')" != 32 ]; then
      echo "record_id 형식이 올바르지 않다" >&2
      exit 1
    fi

    if [ "$record_ip" = "$current_ip" ]; then
      echo "unchanged"
      exit 0
    fi

    update_json=$(timeout "$CURL_TIMEOUT_SECONDS" curl -sS --max-time "$CURL_TIMEOUT_SECONDS" \
      -X PATCH \
      -H "Authorization: Bearer ${CF_API_TOKEN}" \
      -H "Content-Type: application/json" \
      --data "{\"type\":\"A\",\"name\":\"${RECORD_NAME}\",\"content\":\"${current_ip}\",\"ttl\":300,\"proxied\":false}" \
      "${API_BASE}/zones/${ZONE_ID}/dns_records/${record_id}") || {
        echo "DNS 레코드 갱신 요청 실패" >&2
        exit 1
      }

    case "$update_json" in
      *'"success":true'*) echo "updated" ;;
      *) echo "DNS 레코드 갱신 응답이 실패다" >&2; exit 1 ;;
    esac
