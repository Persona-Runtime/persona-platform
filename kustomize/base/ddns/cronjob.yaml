# 유동 공인 IP 대응. app.personaruntime.xyz A 레코드를 5분마다 확인해 바뀐 경우에만 갱신한다.
# Cloudflare 토큰은 Secret cloudflare-dns-token(persona-edge 전용, CP에서 사용자가 생성)에서 온다.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: ddns-update
  labels:
    app.kubernetes.io/name: ddns-update
    app.kubernetes.io/part-of: persona-platform
    app.kubernetes.io/component: edge
spec:
  schedule: "*/5 * * * *"
  # 이전 실행이 끝나기 전에 다음 실행이 겹치면 안 된다 — 둘 다 같은 레코드를 PATCH할 수 있다.
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      template:
        metadata:
          labels:
            # Gate 4: NetworkPolicy가 oauth2-proxy(app.kubernetes.io/name: oauth2-proxy)와
            # 구분해 이 Pod만 선택할 수 있도록 name 라벨을 추가한다(기존엔 component: edge가
            # 같은 네임스페이스의 두 워크로드에 겹쳐 podSelector로 구분이 안 됐다).
            app.kubernetes.io/name: ddns-update
            app.kubernetes.io/part-of: persona-platform
            app.kubernetes.io/component: edge
        spec:
          restartPolicy: Never
          automountServiceAccountToken: false
          securityContext:
            seccompProfile:
              type: RuntimeDefault
          affinity:
            nodeAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                nodeSelectorTerms:
                  - matchExpressions:
                      - key: kubernetes.io/hostname
                        operator: In
                        values:
                          - k8s-worker1
                          - k8s-worker2
          containers:
            - name: ddns-update
              image: curlimages/curl@sha256:43366cd60f226c7655181a0f7e85c468a41d182fdd2dc2c1c3b872a2b9d05d7a
              imagePullPolicy: IfNotPresent
              # 이미지 기본 entrypoint(curl)를 덮어써 스크립트를 실행한다.
              command:
                - /bin/sh
                - /scripts/update-dns.sh
              env:
                - name: ZONE_ID
                  valueFrom:
                    configMapKeyRef:
                      name: ddns-config
                      key: ZONE_ID
                - name: RECORD_NAME
                  valueFrom:
                    configMapKeyRef:
                      name: ddns-config
                      key: RECORD_NAME
                - name: CF_API_TOKEN
                  valueFrom:
                    secretKeyRef:
                      name: cloudflare-dns-token
                      key: api-token
              resources:
                requests:
                  memory: 16Mi
                limits:
                  memory: 32Mi
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop:
                    - ALL
                readOnlyRootFilesystem: true
                runAsNonRoot: true
                runAsUser: 10001
                runAsGroup: 10001
              volumeMounts:
                - name: ddns-script
                  mountPath: /scripts
                  readOnly: true
                - name: tmp
                  mountPath: /tmp
          volumes:
            - name: ddns-script
              configMap:
                name: ddns-config
                items:
                  - key: update-dns.sh
                    path: update-dns.sh
                    mode: 0555
            - name: tmp
              emptyDir: {}
