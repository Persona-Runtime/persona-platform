# mafest API 메트릭 수집. API가 /metrics를 같은 8000(포트 이름 http)에서 제공한다.
#
# 이 선언만으로는 수집되지 않는다. mafest-app에 default-deny가 걸리면 monitoring에서 들어오는 인입을 따로
# 허용해야 한다 — kustomize/base/networkpolicy/mafest-app의 mafest-allow-api-metrics가 그 짝이다.
# 공개 경로(M8 HTTPRoute 초안)는 /metrics를 API로 보내지 않는다.
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: mafest-api
  labels:
    # Prometheus(monitoring-stack)의 기본 podMonitorSelector(release: monitoring-stack). 없으면 대상에서 빠진다.
    release: monitoring-stack
    app.kubernetes.io/part-of: persona-platform
spec:
  namespaceSelector:
    matchNames:
      - mafest-app
  selector:
    # API Pod만 고른다. 같은 namespace의 웹·적재 Job에는 /metrics가 없다.
    matchLabels:
      app.kubernetes.io/name: mafest-api
  podMetricsEndpoints:
    - port: http
      path: /metrics
      scheme: http
      interval: 30s
      scrapeTimeout: 10s
