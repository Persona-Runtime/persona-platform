# 공개 Route(persona-app의 HTTPRoute public-maintenance)가 mafest-app Service를 backend로 쓰게 허락한다.
# 대상은 Service 두 개로 좁힌다 — 다른 Service·Secret은 열지 않는다. Gateway listener가 allowedRoutes Same이라
# Route는 persona-app에 있어야 하므로 namespace 간 참조에 이 grant가 필요하다.
# 공개 Route를 전환하기 전에 이 grant가 먼저 있어야 해서 mafest-app Application으로 먼저 Sync한다.
apiVersion: gateway.networking.k8s.io/v1beta1
kind: ReferenceGrant
metadata:
  name: persona-app-httproute-to-mafest
  labels:
    app.kubernetes.io/part-of: persona-platform
    app.kubernetes.io/component: application
spec:
  from:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      namespace: persona-app
  to:
    - group: ""
      kind: Service
      name: mafest-api
    - group: ""
      kind: Service
      name: mafest-web
