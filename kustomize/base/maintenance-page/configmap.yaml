# nginx 설정과 페이지 본문. 이미지 기본 설정(default.conf)을 이 설정으로 바꿔 끼운다.
# - /healthz 는 200: probe용. 트래픽 경로(/)는 503 + Retry-After 로 페이지를 돌려준다.
# - 모든 임시 파일·pid 는 /tmp(emptyDir)에 둔다 — 루트 파일시스템을 읽기 전용으로 두기 위해서다.
apiVersion: v1
kind: ConfigMap
metadata:
  name: maintenance-page
  labels:
    app.kubernetes.io/name: maintenance-page
    app.kubernetes.io/part-of: persona-platform
data:
  default.conf: |
    server {
      listen 8080;
      server_name _;
      root /usr/share/nginx/html;
      server_tokens off;

      location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
      }

      location = /index.html {
        internal;
        add_header Retry-After 3600 always;
        add_header Cache-Control "no-store" always;
      }

      location / {
        return 503;
      }

      error_page 503 /index.html;
    }
  index.html: |
    <!doctype html>
    <html lang="ko">
    <head>
      <meta charset="utf-8">
      <meta name="viewport" content="width=device-width, initial-scale=1">
      <meta name="robots" content="noindex">
      <title>서비스 준비 중</title>
      <style>
        body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
               font-family: system-ui, -apple-system, "Apple SD Gothic Neo", sans-serif; background: #f6f7f9; color: #1f2933; }
        main { max-width: 32rem; padding: 2rem; text-align: center; }
        h1 { font-size: 1.5rem; margin: 0 0 0.75rem; }
        p { margin: 0; line-height: 1.6; color: #52606d; }
      </style>
    </head>
    <body>
      <main>
        <h1>서비스 준비 중입니다</h1>
        <p>새 서비스를 준비하고 있습니다. 잠시 후 다시 방문해 주세요.</p>
      </main>
    </body>
    </html>
