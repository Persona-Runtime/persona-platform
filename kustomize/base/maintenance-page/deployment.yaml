apiVersion: apps/v1
kind: Deployment
metadata:
  name: maintenance-page
  labels:
    app.kubernetes.io/name: maintenance-page
    app.kubernetes.io/component: maintenance
    app.kubernetes.io/part-of: persona-platform
spec:
  # 정적 페이지 하나라 1대로 둔다. 노드 장애 동안 페이지가 잠시 안 보이는 것은 받아들인다.
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: maintenance-page
  template:
    metadata:
      labels:
        app.kubernetes.io/name: maintenance-page
        app.kubernetes.io/component: maintenance
        app.kubernetes.io/part-of: persona-platform
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      terminationGracePeriodSeconds: 15
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      # 일반 앱처럼 홈 워커에만 둔다(CP·GPU 노드 제외).
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: In
                    values:
                      - k8s-worker1
                      - k8s-worker2
      containers:
        - name: nginx
          # docker.io/nginxinc/nginx-unprivileged:1.29.1-alpine 의 linux/amd64 child manifest.
          # 태그나 상위 index digest로 바꾸지 않는다. 이미지 기본 사용자는 uid 101, 포트 8080이다.
          image: docker.io/nginxinc/nginx-unprivileged@sha256:6742337773a7ca839e7a76f489cc684cc410e3de46c0c83be8bb2bb9944360ef
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 101
            runAsGroup: 101
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
            timeoutSeconds: 1
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
            timeoutSeconds: 1
            failureThreshold: 3
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: content
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
              readOnly: true
            - name: content
              mountPath: /usr/share/nginx/html/index.html
              subPath: index.html
              readOnly: true
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 16Mi
        - name: content
          configMap:
            name: maintenance-page
