# Gate 4 §3 — persona-app 네임스페이스 default-deny + 최소 허용.
#
# Cilium(1.20.1, routingMode: tunnel/VXLAN)은 표준 NetworkPolicy를 그대로 구현한다.
# kubeProxyReplacement가 false라도 무관하다 — NetworkPolicy 시행은 kube-proxy 대체
# 여부와 별개다.
#
# podSelector: {}(네임스페이스 전체)에 policyTypes 둘 다 넣고 rules를 안 적으면
# "이 네임스페이스의 모든 Pod는 아래 다른 NetworkPolicy가 별도로 허용하지 않는 한
# 인바운드·아웃바운드 전부 차단"이 된다. 여러 NetworkPolicy가 같은 Pod를 선택하면
# 허용 목록은 합집합으로 합쳐진다(하나라도 허용하면 허용) — default-deny와 개별 허용을
# 분리해서 적을 수 있는 이유다.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
  labels:
    app.kubernetes.io/part-of: persona-platform
    app.kubernetes.io/component: networkpolicy
  annotations:
    # allow-*(0) → default-deny(1). 허용 규칙이 먼저 들어가야 차단이 걸리는 순간에도
    # 기존 통신이 끊기지 않는다(내부 순서 고정, 2026-09-19).
    argocd.argoproj.io/sync-wave: "1"
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
---
# persona-web: traefik에서만 인입. egress 규칙을 아예 안 둬서(Egress policyType 자체를
# 안 씀) default-deny의 전면 egress 차단을 그대로 유지한다 — 이 컴포넌트는 서버 쪽에서
# 아무 곳으로도 나가지 않는다(브라우저가 직접 /v1을 호출하지, persona-web이 대신 호출하지
# 않는다).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-web
  labels:
    app.kubernetes.io/part-of: persona-platform
    app.kubernetes.io/component: networkpolicy
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: persona-web
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: traefik
      ports:
        - protocol: TCP
          port: 8080
---
# persona-gateway: traefik에서 인입, DB·같은 네임스페이스의 persona-embedding·DNS로만
# 나간다. persona-embedding 쪽 ingress 허용(allow-embedding)은 별도로 아래에 있다.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-gateway
  labels:
    app.kubernetes.io/part-of: persona-platform
    app.kubernetes.io/component: networkpolicy
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: persona-gateway
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: traefik
      ports:
        - protocol: TCP
          port: 8080
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: persona-data
      ports:
        - protocol: TCP
          port: 5432
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: persona-embedding
      ports:
        - protocol: TCP
          port: 8081
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
---
# persona-embedding: 같은 네임스페이스의 gateway에서만 인입, egress 규칙을 아예 안 둬서
# (Egress policyType 자체를 안 씀) default-deny의 전면 egress 차단을 그대로 유지한다 —
# 모델이 이미지에 이미 구워져 있어 오프라인으로 뜨고(HF_HUB_OFFLINE=1), DNS를 포함해
# 어디로도 나갈 필요가 없다(allow-web과 같은 이유).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-embedding
  labels:
    app.kubernetes.io/part-of: persona-platform
    app.kubernetes.io/component: networkpolicy
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: persona-embedding
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: persona-gateway
      ports:
        - protocol: TCP
          port: 8081
---
# persona-migrate: Job이라 인바운드를 받을 이유가 없다(Ingress policyType 자체를 안 써서
# default-deny의 전면 ingress 차단을 유지). DB로 DDL을 실행하고 DNS만 쓴다.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-migrate
  labels:
    app.kubernetes.io/part-of: persona-platform
    app.kubernetes.io/component: networkpolicy
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: persona-migrate
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: persona-data
      ports:
        - protocol: TCP
          port: 5432
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
---
# persona-gateway 메트릭 인입: monitoring의 Prometheus만 8080으로 들어온다.
#
# 왜 allow-gateway에 규칙을 더하지 않고 별도 정책인가: allow-gateway는 "서비스
# 트래픽"의 계약이다(traefik에서 들어오고, DB·embedding·DNS로만 나간다). 관측은
# 목적도 주체도 수명도 다르다 — 수집을 끄거나 대상을 바꿀 때 서비스 경로 규칙을
# 건드리지 않아야 하고, 반대로 서비스 규칙을 고칠 때 관측이 딸려 끊기지도 않아야
# 한다. traefik도 같은 이유로 allow-ingress-metrics를 따로 뒀다.
#
# 왜 수집 주체를 명시해야 하는가: 이 네임스페이스는 default-deny라 "허용하지 않은
# 것은 전부 막힘"이 기본이다. PodMonitor는 Prometheus에게 "이 Pod를 긁어라"라고
# 알려줄 뿐 경로를 열어 주지 않는다. 실제로 traefik에서 PodMonitor만 넣었다가
# Prometheus 타깃이 down 2개로 뜨고 `context deadline exceeded`가 난 기록이 있다
# (runbooks/gate3-4-apply-record-2026-09-19.md §2-13). 그때와 같은 실수를 막으려고
# PodMonitor와 이 정책을 한 쌍으로 둔다.
#
# from을 네임스페이스 라벨로만 좁히는 이유: Prometheus Pod의 라벨은 Helm 차트가
# 정하고 이 저장소가 선언하지 않는다. 차트 업그레이드로 바뀌면 조용히 수집이 끊기므로,
# 저장소가 아는 값(네임스페이스 이름)으로만 건다 — persona-data(9187)·traefik(9100)
# 선례도 전부 같다.
#
# Ingress만 연다. Gateway가 monitoring으로 나갈 일은 없으므로 egress는 default-deny
# 그대로 둔다(allow-web·allow-embedding이 Egress policyType 자체를 안 쓰는 것과 같은 뜻).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-gateway-metrics
  labels:
    app.kubernetes.io/part-of: persona-platform
    app.kubernetes.io/component: networkpolicy
  annotations:
    # allow-*(0) → default-deny(1). 이 파일의 다른 허용 규칙과 같은 wave에 둔다.
    argocd.argoproj.io/sync-wave: "0"
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: persona-gateway
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        # Gateway는 API와 /metrics를 같은 8080에서 제공한다. 전용 metrics 포트가
        # 없으므로 이 허용은 그 포트를 monitoring에도 여는 것이다 — 그래서 from을
        # 네임스페이스 하나로 좁혀 두는 것이 중요하다.
        - protocol: TCP
          port: 8080
