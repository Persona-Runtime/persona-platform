# persona-inference NetworkPolicy — **미적용 초안**. 이 base를 가리키는 Argo Application이
# 없으므로 렌더·검증만 되고 클러스터에는 들어가지 않는다. GPU 노드 조인과 vLLM 배포 승인
# 뒤에 Application을 만든다.
#
# 설계는 terraform/envs/prod/vllm-network-model-bootstrap-plan.md가 정했다. 여기서는 그
# 결정을 매니페스트로 옮긴다.
#
# 선택 기준은 namespace label + Pod label뿐이다. IP·Pod 이름을 정책 기준으로 쓰지 않는다 —
# Pod IP는 재시작마다 바뀌고 이름은 ReplicaSet 해시를 포함해 배포마다 달라진다.
#
# sync-wave: allow는 "0", default-deny는 "1". persona-app·persona-data와 같은 규약이다.
# default-deny가 먼저 들어가면 그 사이에 vLLM이 아무것도 못 하는 창이 생긴다.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
  labels:
    app.kubernetes.io/part-of: persona-platform
    app.kubernetes.io/component: networkpolicy
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  # podSelector를 비워 namespace의 모든 Pod를 고른다. policyTypes 둘 다 적어야 ingress와
  # egress가 함께 막힌다 — 하나만 적으면 반대 방향은 정책이 없는 것과 같다.
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
---
# vLLM 추론 ingress. Gateway Pod만 들어온다.
#
# 포트가 TCP 8000 하나인 근거: persona-gateway의 adapter는
# `{PERSONA_VLLM_BASE_URL}/v1/chat/completions` 하나만 POST한다
# (persona-gateway의 chat/vllm_client.py). 다른 포트·경로를 부르지 않는다.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-vllm-gateway
  labels:
    app.kubernetes.io/part-of: persona-platform
    app.kubernetes.io/component: networkpolicy
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: persona-vllm
  # Ingress만 연다. vLLM이 Gateway로 먼저 연결할 일은 없으므로 egress는 default-deny
  # 그대로 둔다(아래 allow-vllm-dns가 여는 DNS가 유일한 예외다).
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: persona-app
          podSelector:
            matchLabels:
              app.kubernetes.io/name: persona-gateway
      ports:
        - protocol: TCP
          port: 8000
---
# /metrics scrape. **Gateway 허용과 합치지 않는다.**
#
# vLLM은 API와 /metrics를 같은 8000에서 낸다. 포트가 같다는 이유로 위 allow-vllm-gateway의
# from에 monitoring을 더하면, 나중에 누가 그 규칙을 좁힐 때 수집이 함께 끊긴다. 목적이
# 다른 두 허용을 따로 둬서 각각 이유를 갖게 한다(persona-app의 allow-gateway와
# allow-gateway-metrics를 나눈 것과 같은 판단).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-vllm-metrics
  labels:
    app.kubernetes.io/part-of: persona-platform
    app.kubernetes.io/component: networkpolicy
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: persona-vllm
  policyTypes:
    - Ingress
  ingress:
    - from:
        # Prometheus Pod 라벨이 아니라 namespace 라벨로 좁힌다 — Pod 라벨은 Helm 차트가
        # 정하고 이 저장소가 선언하지 않아서, 차트 업그레이드로 조용히 끊길 수 있다.
        # 기존 세 선례(traefik·persona-data·persona-app)도 전부 namespace 라벨만 쓴다.
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - protocol: TCP
          port: 8000
---
# vLLM의 내부 이름 해석. 이것이 vLLM 운영 Pod의 **유일한** egress다.
#
# 모델 다운로드 egress가 여기 없는 것이 설계다. 모델은 seed Job이 미리 내려받아 PVC에
# 두고, vLLM은 그것을 read-only로 읽는다. 그래서 운영 Pod는 외부로 나갈 이유가 없다.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-vllm-dns
  labels:
    app.kubernetes.io/part-of: persona-platform
    app.kubernetes.io/component: networkpolicy
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: persona-vllm
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
---
# model cache seed Job의 DNS. vLLM과 **다른 Pod label**을 고른다.
#
# seed Job을 vLLM 라벨로 만들면 위 ingress·metrics 정책이 seed Pod에도 걸리고, 반대로 이
# 정책의 외부 egress가 vLLM에도 열린다. 둘의 라벨을 나누는 것이 그 사고를 구조적으로 막는다.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-model-seed-dns
  labels:
    app.kubernetes.io/part-of: persona-platform
    app.kubernetes.io/component: networkpolicy
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: persona-vllm-model-seed
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
