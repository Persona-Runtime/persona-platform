# 공개 진입 Gate 4 — GitHub OAuth 기반 ForwardAuth. Traefik의 oauth-forward Middleware가
# 이 Service를 호출해 로그인 여부를 확인한다(persona-app 네임스페이스 HTTPRoute에서
# 크로스 네임스페이스로 참조 — referencegrant.yaml 참고).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: oauth2-proxy
  labels:
    app.kubernetes.io/name: oauth2-proxy
    app.kubernetes.io/component: edge
    app.kubernetes.io/part-of: persona-platform
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: oauth2-proxy
  template:
    metadata:
      labels:
        app.kubernetes.io/name: oauth2-proxy
        app.kubernetes.io/component: edge
        app.kubernetes.io/part-of: persona-platform
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: In
                    values:
                      - k8s-worker1
                      - k8s-worker2
      containers:
        - name: oauth2-proxy
          # 검증된 linux/amd64 child manifest(oauth2-proxy v7.15.4). tag·latest·부모 OCI
          # index digest로 바꾸지 않는다. 확인: docker manifest inspect
          # quay.io/oauth2-proxy/oauth2-proxy:latest 로 얻은 amd64 항목의 digest.
          image: quay.io/oauth2-proxy/oauth2-proxy@sha256:97038fe4354e6ace6612f2f88dc7b332ae6916bddf89da9aea4f2064ea0c2071
          imagePullPolicy: IfNotPresent
          args:
            - --provider=github
            - --github-user=$(GITHUB_ALLOWED_USERS)
            - --upstream=static://202
            - --http-address=0.0.0.0:4180
            - --reverse-proxy=true
            - --set-xauthrequest=true
            - --cookie-secure=true
            - --cookie-samesite=lax
            - --cookie-expire=168h
            - --cookie-refresh=1h
            - --whitelist-domain=app.personaruntime.xyz
            - --redirect-url=https://app.personaruntime.xyz/oauth2/callback
            - --skip-provider-button=true
            - --email-domain=*
          ports:
            - name: http
              containerPort: 4180
              protocol: TCP
          env:
            - name: GITHUB_ALLOWED_USERS
              valueFrom:
                configMapKeyRef:
                  name: oauth2-proxy-config
                  key: GITHUB_ALLOWED_USERS
          envFrom:
            # OAUTH2_PROXY_CLIENT_ID·OAUTH2_PROXY_CLIENT_SECRET·OAUTH2_PROXY_COOKIE_SECRET.
            # CP에서 생성한다 — 값은 Git에 없다. cookie-secret 생성 명령은
            # runbooks/public-ingress.md Gate 4 참고(openssl rand -base64 32 | tr -- '+/' '-_').
            - secretRef:
                name: oauth2-proxy
          resources:
            # 잠정값 — 실측 후 조정.
            requests:
              memory: 32Mi
            limits:
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
          livenessProbe:
            httpGet:
              path: /ping
              port: http
            periodSeconds: 10
            timeoutSeconds: 1
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /ping
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 1
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
