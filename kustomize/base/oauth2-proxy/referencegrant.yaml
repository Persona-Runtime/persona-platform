# persona-app 네임스페이스의 HTTPRoute(backendRef)가 persona-edge의 oauth2-proxy
# Service를 가리킬 수 있게 한다. Gateway API의 LocalObjectReference엔 네임스페이스가
# 없어, 크로스 네임스페이스 참조는 대상 네임스페이스(여기)의 명시적 허가가 있어야
# 한다. ReferenceGrant는 아직 v1beta1이다(Gateway·HTTPRoute처럼 v1로 승격되지 않음).
apiVersion: gateway.networking.k8s.io/v1beta1
kind: ReferenceGrant
metadata:
  name: persona-app-httproute-to-oauth2-proxy
  labels:
    app.kubernetes.io/part-of: persona-platform
    app.kubernetes.io/component: edge
spec:
  from:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      namespace: persona-app
  to:
    - group: ""
      kind: Service
      name: oauth2-proxy
