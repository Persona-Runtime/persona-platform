apiVersion: v1
kind: Service
metadata:
  name: persona-embedding
  labels:
    app.kubernetes.io/name: persona-embedding
    app.kubernetes.io/component: embedding
    app.kubernetes.io/part-of: persona-platform
spec:
  # 외부에 직접 열지 않는다 — gateway만 이 Service를 통해 호출한다.
  type: ClusterIP
  selector:
    app.kubernetes.io/name: persona-embedding
  ports:
    - name: http
      port: 8081
      targetPort: http
      protocol: TCP
