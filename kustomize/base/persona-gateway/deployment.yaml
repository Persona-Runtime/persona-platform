# Python API. 캐릭터·초안·대화 API(/v1/*)와 두 probe 경로(/healthz·/readyz), 그리고
# Prometheus 노출용 /metrics를 **모두 아래 containerPort 8080 하나에서** 제공한다.
# /metrics는 probe와 같은 운영 엔드포인트로 취급돼 인증을 요구하지 않으며, 수집 선언은
# 같은 디렉터리의 podmonitor.yaml이다.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: persona-gateway
  labels:
    app.kubernetes.io/name: persona-gateway
    app.kubernetes.io/component: api
    app.kubernetes.io/part-of: persona-platform
spec:
  # 한 대로 시작한다. 캐릭터 생성은 사용자 행 잠금으로 직렬화되므로 여러 대여도 정확하지만,
  # 이번 단계에서 복제 수를 늘려 얻을 것이 없다.
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      # 새 파드가 준비된 뒤 기존 파드를 내린다. 자리가 없으면 기존 파드를 유지하며 기다린다.
      # 업데이트 중 추가 파드의 자원 여유가 필요하며, 진행 중 요청의 무중단까지 보장하지 않는다.
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: persona-gateway
  template:
    metadata:
      labels:
        app.kubernetes.io/name: persona-gateway
        app.kubernetes.io/component: api
        app.kubernetes.io/part-of: persona-platform
    spec:
      # 이 앱은 Kubernetes API를 호출하지 않는다.
      automountServiceAccountToken: false
      # private GHCR package다. 이 Secret은 Git 밖에서 만들어 두어야 한다.
      imagePullSecrets:
        - name: persona-app-ghcr
      # Uvicorn graceful shutdown이 25초다. 그보다 길게 준다.
      terminationGracePeriodSeconds: 30
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      # CP와 향후 GPU 노드에는 배치하지 않는다.
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: In
                    values:
                      - k8s-worker1
                      - k8s-worker2
      containers:
        - name: gateway
          # 검증된 linux/amd64 child manifest. tag, latest, parent OCI index digest로 바꾸지 않는다.
          # 소스 커밋 6fe5200(bridge 릴리스: G-1 generation 소유권 lease, PR #19 머지),
          # 게시·검증 기록은 docs/ghcr-publication-2026-09-25-bridge-g1.md에 있다.
          #
          # bridge 호환 창: 이 이미지는 0004_chat과 0005_generation_lease를 **둘 다** 허용한다.
          # "허용 목록만 넓힌" 호환 이미지가 아니다 — 기동 시 전역 reconcile이 없고, lease
          # 컬럼이 실제로 있을 때만 lease를 쓴다. 0004에서는 소유자 없는 행 규칙(240초 유예)만
          # 쓰고, 0005가 적용되면 재시작 없이 lease로 바뀐다. Sync 전에 운영 DB의 alembic
          # revision이 0004_chat(또는 0005_generation_lease)인지 확인한다.
          #
          # 롤백 대상은 돌아갈 이미지가 현재 DB revision을 지원하는지가 정한다
          # (persona-gateway/docs/migrations.md). DB가 0004인 동안은 직전 기능 이미지
          # sha256:001d3f57…dccfe(소스 b59eb39, 0004 전용)로 되돌릴 수 있지만, 그 이미지는
          # 전역 기동 reconcile이 있어 교체 때 진행 중 SSE가 끊긴다. 0005 적용 뒤에는 이
          # bridge 이미지만 롤백 목적지다. 0005 downgrade는 이 이미지 이후의 Gateway가 실행
          # 중일 때 하지 않는다(persona-gateway api/generation-ownership-lease-design.md 3절).
          #
          # 이 변경은 배포 순서의 1단계만 담는다. 0005 migration Job, 0005 전용 기능 이미지,
          # replica 2·PDB·topology spread는 이후 단계의 별도 PR이다 — 그래서 replicas는 1이다.
          image: ghcr.io/persona-runtime/persona-minimal-api@sha256:26dcf9e0f2b64aa49c7683bab37ba6a937027b92b0ba2fa1f1f6ed21f53d311e
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            # 비밀이 아니다. pool 대기와 readiness의 SQL 실행을 합친 예산이다.
            - name: PERSONA_DB_TIMEOUT_SECONDS
              value: "2"
            # persona-embedding Service의 ClusterIP DNS 이름. config.py가 읽는 실제
            # 환경 변수명은 PERSONA_EMBEDDING_URL이다(EMBEDDING_URL이 아니다).
            - name: PERSONA_EMBEDDING_URL
              value: http://persona-embedding.persona-app.svc.cluster.local:8081
            # oauth2-proxy가 GitHub 인증 뒤 넘기는 X-Auth-Request-User를 신원으로
            # 받아들인다(subject = github:<login>, 소문자). 이 신뢰는 세 가지가
            # 동시에 성립할 때만 안전하고, 셋 다 이 저장소에서 확인했다:
            #   1. 이 Gateway는 traefik 네임스페이스에서만 도달 가능하다
            #      (networkpolicy/persona-app allow-gateway ingress) — 클라이언트가
            #      Gateway에 직접 헤더를 보낼 경로가 없다.
            #   2. 공개 경로(persona-app-ingress httproute-public.yaml)의 /v1·/ 규칙은
            #      oauth-forward Middleware를 거치고, 그 forwardAuth.authResponseHeaders가
            #      X-Auth-Request-User를 oauth2-proxy 응답 값으로 세운다(oauth2-proxy는
            #      --set-xauthrequest=true로 뜬다) — 클라이언트가 보낸 값은 남지 않는다.
            #   3. 내부/Serve 경로(persona-app httproute.yaml)는 oauth-forward를 안
            #      거치는 대신 strip-auth-header가 /v1·/ 양쪽에서 이 헤더를 지운다.
            # 헤더가 아예 없으면 gateway는 기존 정적 토큰 경로로 넘어간다 — 내부
            # port-forward 검증은 이 값을 켜도 Bearer로 그대로 된다.
            - name: PERSONA_FORWARD_AUTH_ENABLED
              value: "true"
          envFrom:
            # DATABASE_URL(runtime 계정)과 정적 토큰·서명 키가 들어 있다.
            # migrator 자격증명은 여기 없다 — migration Job만 그것을 본다.
            - secretRef:
                name: persona-gateway-runtime
          resources:
            # 초기 제안값이다. 실측으로 확정한 수치가 아니다.
            # psycopg pool max_size가 8이라 메모리는 연결 수에 비례해 늘어난다.
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
          # startup과 liveness는 /healthz다. DB가 죽었다고 앱을 재시작시키면
          # 복구되지도 않는 재시작 루프에 빠진다. DB 상태는 readiness가 본다.
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 2
            timeoutSeconds: 1
            failureThreshold: 15
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
            timeoutSeconds: 1
            failureThreshold: 3
          # readiness는 DB 연결과 필수 Alembic revision을 확인한다. 앱이 스스로 2초 예산 안에
          # 답하므로 timeout 3초면 충분하고, 한 번 실패하면 바로 트래픽에서 뺀다.
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 1
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        # read-only rootfs에서 필요한 유일한 쓰기 경로다.
        - name: tmp
          emptyDir: {}
