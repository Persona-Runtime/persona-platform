# Python API. 캐릭터·초안·대화 API(/v1/*)와 두 probe 경로(/healthz·/readyz), 그리고
# Prometheus 노출용 /metrics를 **모두 아래 containerPort 8080 하나에서** 제공한다.
# /metrics는 probe와 같은 운영 엔드포인트로 취급돼 인증을 요구하지 않으며, 수집 선언은
# 같은 디렉터리의 podmonitor.yaml이다.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: persona-gateway
  labels:
    app.kubernetes.io/name: persona-gateway
    app.kubernetes.io/component: api
    app.kubernetes.io/part-of: persona-platform
spec:
  # 두 대로 운영한다. G-1 generation 소유권 lease(운영 DB 0005_generation_lease)가 들어간 뒤라,
  # 새 Pod가 기동해도 살아 있는 다른 Pod의 generation은 lease가 만료되기 전까지 회수하지 않는다.
  # G-1 이전에는 새 Pod 기동이 다른 Pod의 진행 중 SSE를 reconciling으로 바꿨으므로 replica를
  # 늘리지 않았다. 캐릭터 생성은 사용자 행 잠금으로, 사용자당 활성 generation 1개는 DB 제약으로
  # 직렬화되므로 여러 대여도 정확하다.
  #
  # 롤링 업데이트 중에는 maxSurge 1 때문에 잠깐 세 대가 된다. 그만큼의 메모리와 DB 연결
  # 여유(Pod마다 연결 풀 하나)가 필요하다 — 이 여유는 아직 운영에서 측정하지 않았다.
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      # 새 파드가 준비된 뒤 기존 파드를 내린다. 자리가 없으면 기존 파드를 유지하며 기다린다.
      # 업데이트 중 추가 파드의 자원 여유가 필요하며, 진행 중 요청의 무중단까지 보장하지 않는다.
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: persona-gateway
  template:
    metadata:
      labels:
        app.kubernetes.io/name: persona-gateway
        app.kubernetes.io/component: api
        app.kubernetes.io/part-of: persona-platform
    spec:
      # 이 앱은 Kubernetes API를 호출하지 않는다.
      automountServiceAccountToken: false
      # private GHCR package다. 이 Secret은 Git 밖에서 만들어 두어야 한다.
      imagePullSecrets:
        - name: persona-app-ghcr
      # Uvicorn graceful shutdown이 25초다. 그보다 길게 준다.
      terminationGracePeriodSeconds: 30
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      # 정상 시에는 두 replica를 서로 다른 워커에 둔다. 워커 하나가 죽어도 두 Pod를 함께 잃지
      # 않게 하려는 것이다. 대상은 Gateway Pod뿐이다 — part-of 같은 넓은 label로 고르면 Web 등
      # 다른 앱의 Pod까지 셈에 들어가 분산이 틀어진다.
      #
      # 워커 하나가 cordon·drain·NotReady이거나 사라지면, 두 번째 Pod(와 롤링 중 surge Pod)는
      # 남은 워커에 함께 배치될 수 있다. 분산보다 "한 대라도 더 서비스한다"를 우선한 선택이다.
      # - nodeTaintsPolicy: Honor — 기본값(Ignore)이면 cordon(unschedulable)·NotReady(not-ready,
      #   unreachable) taint가 붙은 노드도 분산 계산에 남는다. 그러면 남은 워커 쪽 skew가 2가 돼
      #   두 번째 Pod가 Pending으로 남고, drain도 옮겨 갈 자리를 잃는다. Honor면 이 Pod가
      #   tolerate하지 않는 NoSchedule taint가 있는 노드를 계산에서 뺀다.
      # - minDomains는 두지 않는다(생략 = 1). 2로 두면 워커 하나만 남았을 때 두 번째 Pod가 항상
      #   Pending이다.
      # NotReady 노드의 기존 Pod는 기본 toleration(NoExecute 300초)이 끝나 eviction된 뒤에야
      # 교체 Pod가 생긴다. 워커가 돌아와도 자동으로 다시 나뉘지 않는다 — 분산은 스케줄링
      # 시점에만 적용되므로 다음 롤아웃·재생성 때까지 한 워커에 몰려 있을 수 있다.
      # 위 동작은 Kubernetes 문서와 scheduler 규칙 기준이며 실제 클러스터에서는 아직 확인하지
      # 않았다.
      topologySpreadConstraints:
        - topologyKey: kubernetes.io/hostname
          maxSkew: 1
          whenUnsatisfiable: DoNotSchedule
          nodeTaintsPolicy: Honor
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: persona-gateway
      # CP와 향후 GPU 노드에는 배치하지 않는다. 위 분산은 이 두 워커 안에서만 계산된다
      # (nodeAffinity를 통과한 노드만 분산 대상 도메인이 된다).
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: In
                    values:
                      - k8s-worker1
                      - k8s-worker2
      containers:
        - name: gateway
          # 검증된 linux/amd64 child manifest. tag, latest, parent OCI index digest로 바꾸지 않는다.
          # 0005_generation_lease migration이 끝난 뒤 쓰는 최종 Gateway 이미지다(persona-gateway
          # PR #20 머지 뒤 게시: 0005 전용 + mock workload profile). 0005만 허용하므로 0004 DB에서는
          # readyz가 503이다. digest를 바꿀 때는 scripts/validate-persona-app-manifests.sh의
          # GATEWAY_IMAGE도 함께 바꾼다.
          #
          # 롤백 대상은 돌아갈 이미지가 현재 DB revision을 지원하는지가 정한다
          # (persona-gateway/docs/migrations.md). DB가 0005인 동안의 롤백 목적지는 bridge 이미지
          # sha256:26dcf9e0…(소스 6fe5200, 0004·0005 허용, lease 인식)다 — 직전 기능 이미지
          # sha256:001d3f57…dccfe(0004 전용)는 0005에서 Ready가 되지 않는다. 0005 downgrade는
          # lease를 인식하는 Gateway가 실행 중일 때 하지 않는다
          # (persona-gateway api/generation-ownership-lease-design.md 3절).
          image: ghcr.io/persona-runtime/persona-minimal-api@sha256:5438d8a80acf414704242901a428c7ef3154bb5496709d3d2d7bea1e9e63f436
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            # 비밀이 아니다. pool 대기와 readiness의 SQL 실행을 합친 예산이다.
            - name: PERSONA_DB_TIMEOUT_SECONDS
              value: "2"
            # persona-embedding Service의 ClusterIP DNS 이름. config.py가 읽는 실제
            # 환경 변수명은 PERSONA_EMBEDDING_URL이다(EMBEDDING_URL이 아니다).
            - name: PERSONA_EMBEDDING_URL
              value: http://persona-embedding.persona-app.svc.cluster.local:8081
            # oauth2-proxy가 GitHub 인증 뒤 넘기는 X-Auth-Request-User를 신원으로
            # 받아들인다(subject = github:<login>, 소문자). 이 신뢰는 세 가지가
            # 동시에 성립할 때만 안전하고, 셋 다 이 저장소에서 확인했다:
            #   1. 이 Gateway는 traefik 네임스페이스에서만 도달 가능하다
            #      (networkpolicy/persona-app allow-gateway ingress) — 클라이언트가
            #      Gateway에 직접 헤더를 보낼 경로가 없다.
            #   2. 공개 경로(persona-app-ingress httproute-public.yaml)의 /v1·/ 규칙은
            #      oauth-forward Middleware를 거치고, 그 forwardAuth.authResponseHeaders가
            #      X-Auth-Request-User를 oauth2-proxy 응답 값으로 세운다(oauth2-proxy는
            #      --set-xauthrequest=true로 뜬다) — 클라이언트가 보낸 값은 남지 않는다.
            #   3. 내부/Serve 경로(persona-app httproute.yaml)는 oauth-forward를 안
            #      거치는 대신 strip-auth-header가 /v1·/ 양쪽에서 이 헤더를 지운다.
            # 헤더가 아예 없으면 gateway는 기존 정적 토큰 경로로 넘어간다 — 내부
            # port-forward 검증은 이 값을 켜도 Bearer로 그대로 된다.
            - name: PERSONA_FORWARD_AUTH_ENABLED
              value: "true"
            # 채팅은 모델을 부르지 않는 mock 모드로 돈다. 기본값(mock)이나 runtime Secret에 기대지
            # 않고 여기서 명시한다 — 명시 env는 envFrom보다 우선하므로 Secret에 같은 키가 있어도
            # 이 값이 적용된다. llm으로 바꾸려면 vLLM 설정이 함께 필요하다(별도 변경).
            - name: PERSONA_CHAT_INFERENCE_MODE
              value: mock
            # Hard Node Failure 실험(persona-ops-lab ROLL-01B)용 응답 모양. long은 80개 고정 합성
            # 조각을 0.5초 간격으로 보내는 약 40초짜리 SSE다 — 노드가 죽는 순간에도 스트림이 열려
            # 있게 하려는 값이며 LLM token·GPU 성능 수치가 아니다. 요청으로는 바꿀 수 없고, 이
            # 값을 바꾸는 것 자체가 Gateway 롤아웃이다.
            - name: PERSONA_CHAT_MOCK_PROFILE
              value: long
          envFrom:
            # DATABASE_URL(runtime 계정)과 정적 토큰·서명 키가 들어 있다.
            # migrator 자격증명은 여기 없다 — migration Job만 그것을 본다.
            - secretRef:
                name: persona-gateway-runtime
          resources:
            # 초기 제안값이다. 실측으로 확정한 수치가 아니다.
            # psycopg pool max_size가 8이라 메모리는 연결 수에 비례해 늘어난다.
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
          # startup과 liveness는 /healthz다. DB가 죽었다고 앱을 재시작시키면
          # 복구되지도 않는 재시작 루프에 빠진다. DB 상태는 readiness가 본다.
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 2
            timeoutSeconds: 1
            failureThreshold: 15
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
            timeoutSeconds: 1
            failureThreshold: 3
          # readiness는 DB 연결과 필수 Alembic revision을 확인한다. 앱이 스스로 2초 예산 안에
          # 답하므로 timeout 3초면 충분하고, 한 번 실패하면 바로 트래픽에서 뺀다.
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 1
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        # read-only rootfs에서 필요한 유일한 쓰기 경로다.
        - name: tmp
          emptyDir: {}
