# Alembic migration을 Gateway와 분리해 실행한다.
#
# 왜 분리하는가: Gateway 시작 명령에 migration을 넣으면 replica마다 같은 DDL이 경쟁하고,
# 앱이 뜨지 못하는 이유가 migration 실패인지 DB 장애인지 구분되지 않는다. Gateway 이미지는
# 앱 시작 시 migration을 실행하지 않도록 만들어져 있고, 이 Job이 그 계약의 반대편이다.
#
# 왜 PreSync hook이 아닌가: DB가 아직 없는 첫 설치에서 migration부터 돌게 된다.
# 이번에는 사람이 단계별로 진행한다 — DB 준비를 눈으로 확인한 뒤 이 Job을 적용한다.
#
# 이름에 alembic revision이 들어간다. Job은 불변 필드가 많아 같은 이름으로 수정할 수 없다.
# revision이 이름에 있으면 새 migration은 자연히 새 Job이 되고, 이전 Job과 로그가 남아
# 실패 원인을 나중에도 볼 수 있다. 같은 revision을 다시 돌려야 하면 로그를 확인한 뒤
# 명시적으로 삭제하고 재생성한다.
#
# 운영 DB는 0003_material_chunks까지 올라가 있다(2026-09-21 적용). 이 Job은 `alembic
# upgrade head`로 0004_chat 하나를 더 올린다 — 채팅 4표(conversations·user_messages·
# generations·chat_idempotency_records)와 personas.active_version_id 컬럼이다.
# env.py는 DATABASE_URL만 읽고 Settings()에 의존하지 않으며, 0004 리비전 파일도
# alembic.op만 써서 다른 env 없이 그대로 시작한다.
#
# 이 Job이 끝난 뒤 grants를 다시 적용해야 한다(db/grants/persona_minimal.sql의 3-3절) —
# migration은 테이블만 만들고 권한은 주지 않는다. 순서는 런북 §5 → §6.
apiVersion: batch/v1
kind: Job
metadata:
  name: persona-migrate-0004-chat
  labels:
    app.kubernetes.io/name: persona-migrate
    app.kubernetes.io/component: database-migration
    app.kubernetes.io/part-of: persona-platform
    persona.runtime/alembic-revision: "0004-chat"
spec:
  # 실패를 재시도로 덮지 않는다. DDL 실패는 사람이 로그를 보고 판단할 문제다.
  backoffLimit: 0
  # 잠금 대기 등으로 영원히 매달리지 않게 상한을 둔다. migration 자체는 수 초면 끝난다.
  activeDeadlineSeconds: 600
  # 완료된 Job과 로그를 바로 지우지 않는다. ttlSecondsAfterFinished를 두지 않는 이유다.
  template:
    metadata:
      labels:
        app.kubernetes.io/name: persona-migrate
        app.kubernetes.io/component: database-migration
        app.kubernetes.io/part-of: persona-platform
    spec:
      restartPolicy: Never
      # migration은 Kubernetes API를 쓰지 않는다.
      automountServiceAccountToken: false
      imagePullSecrets:
        - name: persona-app-ghcr
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: In
                    values:
                      - k8s-worker1
                      - k8s-worker2
      containers:
        - name: alembic
          # Gateway와 완전히 같은(호환) 이미지를 쓴다. migration 코드와 앱 코드가 갈라지면
          # readiness가 요구하는 revision과 실제 적용된 revision이 어긋난다.
          # 검증된 linux/amd64 child manifest다. tag나 parent index digest로 바꾸지 않는다.
          # Gateway Deployment와 같은 digest이고, 소스는 gateway 7bc9738(PR #14 머지),
          # 검증 기록은 docs/ghcr-publication-2026-09-23-compat-0004.md에 있다.
          #
          # 이 파일은 2026-09-23 백업·subject 전환을 끝낸 뒤 kustomization.yaml의
          # resources에 연결했다(런북 5단계). digest 반영(2단계)과 연결을 두 커밋으로
          # 나눈 이유: 연결하면 이 Job이 렌더에 들어가 apply 대상이 되는데, 호환 이미지
          # Sync(3단계)는 백업(4단계)보다 앞이라 함께 묶으면 되돌릴 지점 없이 migration이
          # 돌 수 있었다. 지켜야 할 불변식은 **"연결은 digest와 승인 등록(validator의
          # MIGRATION_IMAGES)이 끝난 뒤, 그리고 백업이 끝난 뒤에만"**이다.
          image: ghcr.io/persona-runtime/persona-minimal-api@sha256:ce380717fcf1d2db0ffd22e9d4726914a82006472f4ea725e4a2d889b2d032da
          imagePullPolicy: IfNotPresent
          command: ["/app/.venv/bin/alembic"]
          args: ["upgrade", "head"]
          env:
            # migrator 전용 자격증명만 준다. runtime Secret을 참조하지 않는다.
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: persona-gateway-migrator
                  key: DATABASE_URL
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        # read-only rootfs에서 쓰기가 필요한 유일한 경로다.
        - name: tmp
          emptyDir: {}
