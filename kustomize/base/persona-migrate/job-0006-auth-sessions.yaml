# Alembic migration을 Gateway와 분리해 실행한다 — 0005_generation_lease → 0006_auth_sessions.
#
# 왜 분리하는가·왜 PreSync hook이 아닌가·왜 이름에 revision이 들어가는가는 history/의 0004 Job과
# 같다: 앱 시작 시 DDL을 돌리지 않는 계약의 반대편이고, 사람이 단계별로 확인한 뒤 적용하며, Job은
# 불변 필드가 많아 revision마다 새 Job으로 만들고 로그를 남긴다.
#
# 무엇을 하는가(persona-gateway migrations/versions/0006_auth_sessions.py): 계정·세션 테이블 두 개
# (credentials, sessions)와 sessions(subject, expires_at) 인덱스 하나를 만든다 — 일반 회원가입·
# 로그인·세션 토큰(A-1). 기존 테이블·컬럼은 바꾸지 않는다.
#
# 왜 `upgrade head`가 아닌가: 이 Job이 올리는 revision을 선언에 고정한다. head는 이미지가 담은
# 마지막 revision이라, 나중에 다른 revision을 담은 이미지로 잘못 연결돼도 조용히 더 올라간다.
# target을 적어 두면 의도한 revision에서 멈춘다(validator가 Job 이름과 target 일치를 검사한다).
#
# 전제(적용 전 사람이 확인):
# - 운영 Gateway가 bridge 이미지(아래와 같은 digest 76d389d6, 0005·0006 둘 다 Ready)로 롤아웃돼 있어야
#   한다. 0005 전용 이미지(cd81c026)가 떠 있을 때 적용하면 그 Pod는 즉시 NotReady가 된다.
# - 운영 DB가 정확히 0005_generation_lease이고, 백업이 끝나 있어야 한다(기존 5단계 불변식: 연결은
#   digest·승인 등록 뒤, 그리고 백업 뒤에만).
#
# 실행 영향: 새 테이블 CREATE TABLE·CREATE INDEX만 하고 기존 표 정의는 바꾸지 않는다. 다만 두 표가
# users를 참조하는 FK를 만들 때 users에 SHARE ROW EXCLUSIVE 잠금을 잠깐 잡는다 — 그동안 users 쓰기
# (캐릭터 생성의 사용자 upsert 등)만 대기하고 읽기는 막지 않는다. 빈 표 생성이라 수 초 안에 끝난다.
# bridge Gateway는 적용이 커밋된 뒤 재시작 없이 auth 경로를 연다.
#
# 적용 직후 grants가 필수다: 새 테이블이라 기존 권한을 상속하지 않는다. db/grants/persona_minimal.sql을
# 곧바로 적용한다 — 그 전까지 auth 경로(/v1/auth/*)는 permission denied(500)이고 다른 API는 정상이다.
#
# 실패 시: 재시도하지 않고(backoffLimit: 0), 자동 rollback·downgrade도 하지 않는다. DDL은 트랜잭션이라
# 실패하면 DB는 0005에 그대로 남는다 — 사람이 로그를 보고 판단한다.
#
# 적용·확인이 끝나면 이 파일을 history/로 옮기고 resources를 다시 비운다(다음 PR).
apiVersion: batch/v1
kind: Job
metadata:
  name: persona-migrate-0006-auth-sessions
  labels:
    app.kubernetes.io/name: persona-migrate
    app.kubernetes.io/component: database-migration
    app.kubernetes.io/part-of: persona-platform
    persona.runtime/alembic-revision: "0006-auth-sessions"
spec:
  # 실패를 재시도로 덮지 않는다. DDL 실패는 사람이 로그를 보고 판단할 문제다.
  backoffLimit: 0
  # 잠금 대기 등으로 영원히 매달리지 않게 상한을 둔다. migration 자체는 수 초면 끝난다.
  activeDeadlineSeconds: 600
  # 완료된 Job과 로그를 바로 지우지 않는다. ttlSecondsAfterFinished를 두지 않는 이유다.
  template:
    metadata:
      labels:
        app.kubernetes.io/name: persona-migrate
        app.kubernetes.io/component: database-migration
        app.kubernetes.io/part-of: persona-platform
    spec:
      restartPolicy: Never
      # migration은 Kubernetes API를 쓰지 않는다.
      automountServiceAccountToken: false
      imagePullSecrets:
        - name: persona-app-ghcr
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: In
                    values:
                      - k8s-worker1
                      - k8s-worker2
      containers:
        - name: alembic
          # 운영 Gateway와 같은 bridge 이미지다. migration 코드와 앱 코드가 갈라지면 readiness가
          # 요구하는 revision과 실제 적용된 revision이 어긋난다. 검증된 linux/amd64 child
          # manifest다. tag나 parent index digest로 바꾸지 않는다. 소스는 gateway develop 3ee5534
          # (PR #23·#24 머지 뒤), smoke 통과 후 소유자가 전달한 digest다.
          image: ghcr.io/persona-runtime/persona-minimal-api@sha256:76d389d6ce0edf83d61b2240c54801c98a68fdc866cd9a7a201220607f5a07e5
          imagePullPolicy: IfNotPresent
          command: ["/app/.venv/bin/alembic"]
          args: ["upgrade", "0006_auth_sessions"]
          env:
            # migrator 전용 자격증명만 준다. runtime Secret을 참조하지 않는다.
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: persona-gateway-migrator
                  key: DATABASE_URL
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        # read-only rootfs에서 쓰기가 필요한 유일한 경로다.
        - name: tmp
          emptyDir: {}
