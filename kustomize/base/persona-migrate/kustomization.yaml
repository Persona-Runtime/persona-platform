apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# 활성 렌더에는 **이번에 적용할 migration Job 하나만** 둔다.
#
# 과거 Job 선언을 여기에 남기면 안 된다. "완료된 Job은 다시 Sync해도 재실행되지 않는다"는
# 그 Job이 클러스터에 남아 있을 때만 참인데, 0001 Job은 이미 삭제했다
# (runbooks/test-resource-cleanup.md). 지금 Sync하면 구형 이미지로 다시 만들어지고,
# 여러 Job을 함께 Sync하면 적용 순서도 보장되지 않는다.
#
# 지난 선언은 history/에 이력으로 둔다. 렌더되지 않으므로 클러스터에 영향이 없다.
#
# 지금은 적용할 migration이 없어 비어 있다. 새 revision을 낼 때 그 Job 파일 하나만 넣는다.
# 연결 시점과 순서는 persona-gateway/docs/migrations.md.
resources: []
