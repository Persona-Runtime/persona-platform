apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# 활성 렌더에는 **이번에 적용할 migration Job 하나만** 둔다.
#
# 과거 Job 선언을 여기에 남기면 안 된다. "완료된 Job은 다시 적용해도 재실행되지 않는다"는
# 그 Job이 클러스터에 남아 있을 때만 참인데, 0001 Job은 이미 삭제했다
# (runbooks/test-resource-cleanup.md). 지금 다시 apply하면 구형 이미지로 다시 만들어지고,
# 여러 Job을 함께 넣으면 적용 순서도 보장되지 않는다. (argocd/persona-migrate.yaml
# Application은 저장소에서 뺐다 — CP가 `kubectl apply -k`로 직접 적용한다.)
#
# 지난 선언은 history/에 이력으로 둔다. 렌더되지 않으므로 클러스터에 영향이 없다.
#
# 새 revision을 낼 때 그 Job 파일 하나만 넣고, 적용·확인이 끝나면 history/로 옮기고
# 다시 비운다(0001 때와 같은 패턴). 연결 시점과 순서는 persona-gateway/docs/migrations.md.
#
# 0003(2026-09-21)·0004(2026-09-23) Job은 적용·검증을 끝내고 history/로 옮겼다 —
# 기록은 runbooks/gate3-4-apply-record-2026-09-19.md와 런북 §5.
#
# 0005(2026-09-25 연결): G-1 generation 소유권 lease 컬럼. 운영 Gateway가 bridge 이미지로
# 롤아웃되고 백업이 끝난 뒤 적용한다. 적용·확인이 끝나면 history/로 옮기고 다시 비운다.
resources:
  - job-0005-generation-lease.yaml
