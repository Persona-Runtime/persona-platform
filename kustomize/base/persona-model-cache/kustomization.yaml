# vLLM 모델 cache: persona-inference Namespace, GPU 노드 local-path PVC, 모델 seed Job.
#
# **Argo Application이 없다.** 첫 seed는 사람이 control-plane에서 overlay
# (kustomize/overlays/prod/persona-model-cache)를 적용하고 결과를 확인한다. vLLM Deployment,
# NetworkPolicy Application, FQDN allowlist, Gateway egress는 여기에 넣지 않는다 — 모델 다운로드
# 호스트를 첫 seed에서 관측한 뒤에 정한다.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespace.yaml
  - model-cache-pvc.yaml
  - model-seed-job.yaml
# seed 스크립트를 ConfigMap으로 싣는다. 이름 뒤에 내용 hash가 붙어, 스크립트를 고치면 Job이
# 새 ConfigMap을 가리키게 된다(Job은 불변이라 다시 실행하려면 Job을 지우고 적용한다).
configMapGenerator:
  - name: persona-vllm-model-seed-script
    files:
      - seed_model.py
    options:
      labels:
        app.kubernetes.io/name: persona-vllm-model-seed
        app.kubernetes.io/component: model-cache-seed
        app.kubernetes.io/part-of: persona-platform
