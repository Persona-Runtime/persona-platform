# vLLM 모델 cache: persona-inference Namespace, GPU 노드 local-path PVC, 모델 seed Job.
#
# **Argo Application이 없다.** 첫 seed는 사람이 control-plane에서 overlay
# (kustomize/overlays/prod/persona-model-cache)를 적용하고 결과를 확인한다. vLLM Deployment,
# NetworkPolicy Application, FQDN allowlist, Gateway egress는 여기에 넣지 않는다 — 모델 다운로드
# 호스트를 첫 seed에서 관측한 뒤에 정한다.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespace.yaml
  - model-cache-pvc.yaml
  - model-seed-job.yaml
  # seed 스크립트 ConfigMap. 임시 DNS discovery Job과 같은 스크립트를 쓰려고 공용 base로 뺐다.
  - ../persona-model-seed-script
