# vLLM과 모델 cache seed만 사는 namespace. persona-app과 분리한 이유는 폭발 반경이다 — vLLM은
# 모델 가중치와 GPU를 쥐고 있고, Gateway와 같은 namespace에 두면 default-deny 안에서 서로 자유롭게
# 통신하게 되어 "Gateway만 vLLM을 부를 수 있다"를 정책으로 표현할 수 없다.
#
# 소유: 이 overlay(persona-model-cache)가 Namespace를 선언한다. 예전 bootstrap/namespaces/
# persona-inference.yaml(적용된 적 없음)은 지웠다 — 같은 Namespace를 두 곳에서 선언하지 않는다.
# NetworkPolicy overlay(persona-inference-netpol)는 이 Namespace가 있다는 전제로 정책만 담는다.
#
# Pod Security Admission 라벨은 붙이지 않는다. 이 저장소의 다른 namespace에도 없어서 여기만
# 두면 관례가 갈린다. seed Job은 restricted 수준의 securityContext(non-root, read-only rootfs,
# capability drop, seccomp RuntimeDefault)를 스스로 선언한다.
apiVersion: v1
kind: Namespace
metadata:
  name: persona-inference
  labels:
    app.kubernetes.io/part-of: persona-platform
    app.kubernetes.io/component: inference
