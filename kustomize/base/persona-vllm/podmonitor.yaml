# vLLM 메트릭 수집. 규약은 persona-gateway PodMonitor와 같다: release=monitoring-stack label(
# monitoring-stack의 podMonitorSelector), namespaceSelector로 namespace 고정, Pod name label로
# 좁히기, 포트는 번호가 아니라 이름(http), 30초 scrape·10초 timeout.
#
# vLLM은 API와 /metrics를 같은 8000(http)에서 낸다. 수집하는 것은 vLLM 자체 지표(요청·토큰·KV
# cache 등)뿐이다. GPU 장치 지표는 DCGM exporter가 이미 수집하므로 GPU exporter를 새로 두지 않는다.
#
# 이 선언만으로는 수집되지 않을 수 있다. vLLM Ingress를 고르는 정책(allow-vllm-gateway 등)이
# 하나라도 적용되면 vLLM 인입이 격리되므로, allow-vllm-metrics(monitoring의 Prometheus Pod → 8000)가
# 함께 있어야 한다(NetworkPolicy는 아직 미적용). 그 정책은 Prometheus Pod label로 좁혀 있어, 차트
# 업그레이드로 label이 바뀌면 이 Target이 DOWN이 된다.
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: persona-vllm
  labels:
    release: monitoring-stack
    app.kubernetes.io/part-of: persona-platform
spec:
  namespaceSelector:
    matchNames:
      - persona-inference
  selector:
    matchLabels:
      app.kubernetes.io/name: persona-vllm
  podMetricsEndpoints:
    - port: http
      path: /metrics
      scheme: http
      interval: 30s
      scrapeTimeout: 10s
