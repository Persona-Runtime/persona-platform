# **임시** 모델 다운로드 DNS discovery — 영구 정책이 아니다.
#
# persona-inference에 영구 default-deny와 최소 FQDN allowlist를 넣기 전에, seed가 실제로 질의·접속하는
# 호스트를 관측하려고 잠깐만 적용한다. 관측을 기록하면 이 overlay 전체(Job·임시 정책·ConfigMap)를
# 지운다. 최소 FQDN allowlist와 default-deny는 별도 PR로 만든다.
#
# - Argo Application이 없고 prod overlay가 이 경로를 가리키지 않는다(validator가 막는다).
# - 모델 cache PVC를 쓰지 않는다. discovery Job은 emptyDir에 받으므로 현재 cache를 지우거나 seed
#   Job을 다시 실행하지 않는다.
# - namePrefix로 seed Job용 ConfigMap과 이름을 나눠, 이 overlay를 지워도 seed 스크립트가 함께
#   지워지지 않는다.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: persona-inference
namePrefix: dns-discovery-
resources:
  - ../../../base/persona-model-seed-script
  - discovery-job.yaml
  - dns-discovery-policy.yaml
