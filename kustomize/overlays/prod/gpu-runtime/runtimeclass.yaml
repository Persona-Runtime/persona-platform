# containerd 설정에서 확인한 handler 이름(`runtimes.nvidia`)과 정확히 맞춘다.
# scheduling을 여기에도 넣어 두면 GPU runtime을 참조한 일반 Pod가 홈 워커에 잘못
# 배치되는 것을 막는다. 이 label·taint 계약은 GPU 노드 조인 절차에서 이미 설정했다.
apiVersion: node.k8s.io/v1
kind: RuntimeClass
metadata:
  name: nvidia
handler: nvidia
scheduling:
  nodeSelector:
    personaruntime.xyz/node-pool: gpu
  tolerations:
    - key: personaruntime.xyz/dedicated
      operator: Equal
      value: gpu-serving
      effect: NoSchedule
