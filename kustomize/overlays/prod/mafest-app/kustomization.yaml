apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# mafest API·웹(M6 내부 배포). 승인된 이미지 digest·설정을 담은 base를 그대로 연결한다.
# Argo Application(argocd/mafest-app.yaml)은 자동 Sync가 없다. 사람이 mafest-app-netpol을 먼저 Sync한 뒤
# 승인 SHA로 수동 Sync한다(argocd/README.md, 런북). 공개 HTTPRoute(M8)는 여기에 넣지 않는다.
# namespace는 bootstrap/namespaces/mafest-app.yaml이 소유한다.
namespace: mafest-app
resources:
  - ../../../base/mafest-app
