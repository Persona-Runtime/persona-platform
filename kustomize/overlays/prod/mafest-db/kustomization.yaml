apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# mafest DB(CNPG Cluster·PodMonitor)만 관리한다. NetworkPolicy는 mafest-db-netpol이 따로 관리한다
# (DB Sync와 정책 변경을 다른 확인 지점에서 다루기 위해서다 — persona-db와 같은 분리).
# namespace는 bootstrap/namespaces/mafest-data.yaml이 소유한다. Namespace를 넣지 않는다.
namespace: mafest-data
resources:
  - ../../../base/mafest-db
