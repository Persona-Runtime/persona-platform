# 공개(https, 인터넷) 경로와 내부(http, Tailnet/Serve) 경로 모두 준비 중 페이지로 보낸다.
# 경로 분기는 두지 않는다 — /v1 같은 API 경로도 503 페이지를 받는다.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: public-maintenance
  labels:
    app.kubernetes.io/part-of: persona-platform
    app.kubernetes.io/component: maintenance
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  parentRefs:
    - name: persona-app
      sectionName: https
  hostnames:
    - app.personaruntime.xyz
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      filters:
        - type: ExtensionRef
          extensionRef:
            group: traefik.io
            kind: Middleware
            name: maintenance-security-headers
      backendRefs:
        - name: maintenance-page
          port: 8080
---
# http listener에는 hostname이 없다(Serve·IP 접근). 이 Route에도 hostname을 넣지 않는다.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: internal-maintenance
  labels:
    app.kubernetes.io/part-of: persona-platform
    app.kubernetes.io/component: maintenance
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  parentRefs:
    - name: persona-app
      sectionName: http
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: maintenance-page
          port: 8080
