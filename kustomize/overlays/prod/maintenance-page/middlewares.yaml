# maintenance-security-headers: 준비 중 페이지 복구용 보안 헤더(내부 http Route와 복구 경로가 쓴다). 폐기한
# persona-app-ingress의 security-headers와 같은 값이다.
# 아래 mafest-* Middleware는 공개 Route(public-maintenance)가 mafest 웹·API로 전환된 뒤 쓰는 것이다.
# 인증(oauth-forward)·retry·buffering(body-limit)은 두지 않는다 — 로그인이 없고, buffering은 SSE 응답까지 모은다.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: maintenance-security-headers
  labels:
    app.kubernetes.io/part-of: persona-platform
    app.kubernetes.io/component: maintenance
  annotations:
    # Middleware(-1) → HTTPRoute(1). HTTPRoute가 이 Middleware를 이름으로 참조한다.
    argocd.argoproj.io/sync-wave: "-1"
spec:
  headers:
    stsSeconds: 31536000
    stsIncludeSubdomains: true
    contentTypeNosniff: true
    referrerPolicy: same-origin
---
# mafest 공개 응답 보안 헤더.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: mafest-security-headers
  labels:
    app.kubernetes.io/part-of: persona-platform
    app.kubernetes.io/component: application
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  headers:
    stsSeconds: 31536000
    stsIncludeSubdomains: true
    contentTypeNosniff: true
    referrerPolicy: same-origin
---
# 검색(POST /v1/search·/v1/search/stream): 같은 묶음, 분당 6·burst 3(승인 계약). 두 경로가 한 Route 규칙이라 한 Middleware를
# 쓴다. IP는 접속 주소(depth 0)로 센다 — 클라이언트가 보낸 X-Forwarded-For를 믿지 않는다. Traefik 복제본(2)마다 따로 세므로
# 복제본 전체에서 정확히 합산되는 전역 제한이 아니다.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: mafest-search-rate-limit
  labels:
    app.kubernetes.io/part-of: persona-platform
    app.kubernetes.io/component: application
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  rateLimit:
    average: 6
    period: 1m
    burst: 3
    sourceCriterion:
      ipStrategy:
        depth: 0
---
# 상품 상세(GET /v1/products/...): 분당 30(승인 계약). burst는 계약에 없어 10으로 둔다. 복제본별로 센다.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: mafest-detail-rate-limit
  labels:
    app.kubernetes.io/part-of: persona-platform
    app.kubernetes.io/component: application
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  rateLimit:
    average: 30
    period: 1m
    burst: 10
    sourceCriterion:
      ipStrategy:
        depth: 0
---
# /v1/meta와 정적 파일: 기존 일반 제한(초당 20·burst 50, 문서 37). 복제본별로 센다.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: mafest-general-rate-limit
  labels:
    app.kubernetes.io/part-of: persona-platform
    app.kubernetes.io/component: application
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  rateLimit:
    average: 20
    period: 1s
    burst: 50
    sourceCriterion:
      ipStrategy:
        depth: 0
