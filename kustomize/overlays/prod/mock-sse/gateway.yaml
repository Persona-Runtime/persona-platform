apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: persona-mock-sse
  labels:
    app.kubernetes.io/part-of: persona-platform
    app.kubernetes.io/component: synthetic-sse-test
spec:
  gatewayClassName: traefik
  listeners:
    - name: http
      protocol: HTTP
      # Gateway listeners bind Traefik entryPoints, not Service ports.
      # The Traefik HTTP Service port is 80; its HTTP entryPoint is 8000.
      port: 8000
      allowedRoutes:
        namespaces:
          from: Same
