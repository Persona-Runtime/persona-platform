apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: persona-mock-sse
  labels:
    app.kubernetes.io/part-of: persona-platform
    app.kubernetes.io/component: synthetic-sse-test
spec:
  parentRefs:
    - name: persona-mock-sse
      sectionName: http
  rules:
    - matches:
        - method: POST
          path:
            type: Exact
            value: /mock/chat
      backendRefs:
        - name: persona-mock-sse
          port: 8080
