# 인터넷(app.personaruntime.xyz) 전용 경로. 기존 httproute.yaml(persona-app, sectionName: http,
# hostname 없음)과 규칙은 동일하게 미러링하지만 별개 리소스로 둔다.
#
# hostnames는 HTTPRoute 전체에 걸린다 — 기존 httproute.yaml에 hostname을 넣으면 Serve(IP·tailnet
# 이름 접근)가 끊긴다. 그래서 https listener(sectionName: https)에 붙는 이 파일을 새로 만든다.
#
# 경로를 다시 쓰지 않는다(URLRewrite 필터 없음). Python API가 실제로 /v1/me, /v1/personas 를
# 받는다. 접두사를 떼면 404가 된다.
#
# Gate 4: 필터 목록의 순서가 곧 적용 순서다. Traefik 미들웨어 체인은 요청은 목록 순서대로
# 통과하고 응답은 역순으로 돌아온다 — 목록에서 앞선 미들웨어일수록 뒤에 오는 미들웨어를
# 감싸는 바깥쪽 레이어가 된다. oauth-forward(ForwardAuth)가 미인증 요청에 302를 돌려주면
# 그 뒤(목록상 뒤)의 미들웨어는 아예 실행되지 않지만, 그 앞(목록상 앞)의 미들웨어는 이미
# 감싸고 있어 이 302 응답도 거쳐 나간다. 그래서 security-headers를 맨 앞에 둬야 302든
# 429든 모든 응답에 보안 헤더가 실제로 붙는다(2026-09-20 LTE 실측: 기존 순서에서 미인증
# 302 응답에 strict-transport-security가 없었다). rate-limit은 그다음 — 초당 요청이 너무
# 많으면 GitHub 로그인 여부를 묻기도 전에 429로 끊는다(oauth2-proxy를 불필요한 부하로부터
# 보호). body-limit(/v1만)은 요청 크기 제한이라 인증보다 먼저 걸러도 무방해 oauth-forward
# 앞에 둔다. oauth-forward가 맨 뒤 — 실제 인증 확인은 다른 필터를 다 통과한 뒤에 한다.
# /oauth2는 oauth2-proxy 콜백·정적 자산 경로라 인증 필터 없이 바로 통과시킨다(그 경로
# 자체가 로그인 흐름이라 자기 자신을 인증할 수 없다).
#
# Sync 분리(2026-09-19): persona-app-ingress 소속. Gateway 객체 자체(listener 선언)는
# persona-app에 남아 있다 — 한 Gateway를 두 Application이 나눠 관리할 수 없어서다.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: persona-app-public
  labels:
    app.kubernetes.io/part-of: persona-platform
    app.kubernetes.io/component: application
  annotations:
    # Middleware(-1) → HTTPRoute(1) — 이 Application엔 Gateway 객체가 없어 wave 0은
    # 비운다(내부 순서 고정, 2026-09-19).
    argocd.argoproj.io/sync-wave: "1"
spec:
  parentRefs:
    - name: persona-app
      sectionName: https
  hostnames:
    - app.personaruntime.xyz
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /oauth2
      filters:
        - type: ExtensionRef
          extensionRef:
            group: traefik.io
            kind: Middleware
            name: security-headers
      backendRefs:
        - name: oauth2-proxy
          namespace: persona-edge
          port: 4180
    # 채팅 SSE 두 경로 — body-limit만 뺀다.
    #
    # body-limit은 Traefik buffering Middleware다. 요청 본문뿐 아니라 응답도 끝까지 모았다가
    # 한 번에 보내므로, 토큰 단위로 흘러야 하는 SSE 응답이 생성이 끝날 때까지 도착하지 않는다.
    # 그래서 SSE를 여는 두 API만 이 rule로 떼고 나머지 필터(security-headers·rate-limit·
    # oauth-forward)와 순서, backend는 /v1 rule과 같게 둔다.
    #
    # 그 대가로 이 두 경로에는 프록시의 2 MiB 요청 본문 제한도 없다. Gateway의 질문 길이 검사
    # (글자 수, JSON 파싱 뒤)는 HTTP 본문 크기 제한이 아니다 — 큰 본문은 앱이 끝까지 읽은 뒤에야
    # 거절된다. 이 경로의 본문 크기 방어는 oauth-forward(로그인 사용자만)와 rate-limit에 기댄다.
    #
    # 매칭은 Traefik v3.7(chart 41.4.0) Gateway provider가 지원하는 방식으로 한정한다.
    # - chat/completions: Exact. 경로에 가변 부분이 없다.
    # - retry: RegularExpression(Traefik PathRegexp). generation_id가 경로 가운데에 있어 Exact·
    #   PathPrefix로는 표현할 수 없다. PathRegexp는 부분 일치라 ^…$로 전체 경로를 고정한다 —
    #   없으면 /v1/generations/x/retry/y 같은 경로도 이 rule로 빠져 body-limit을 우회한다.
    # - 두 매치 모두 method POST로 한정한다. 다른 method는 /v1 rule(body-limit 있음)로 간다.
    #
    # 우선순위: Traefik은 rule 순서가 아니라 매치 모양으로 router priority를 계산한다
    # (pkg/provider/kubernetes/gateway/httproute.go buildMatchRule). Exact 100000, RegularExpression
    # 10000+길이×100, method +1000이므로 두 매치 모두 /v1 PathPrefix(10000+3×100)보다 항상 먼저다.
    - matches:
        - method: POST
          path:
            type: Exact
            value: /v1/chat/completions
        - method: POST
          path:
            type: RegularExpression
            value: ^/v1/generations/[^/]+/retry$
      filters:
        - type: ExtensionRef
          extensionRef:
            group: traefik.io
            kind: Middleware
            name: security-headers
        - type: ExtensionRef
          extensionRef:
            group: traefik.io
            kind: Middleware
            name: rate-limit
        - type: ExtensionRef
          extensionRef:
            group: traefik.io
            kind: Middleware
            name: oauth-forward
      backendRefs:
        - name: persona-gateway
          port: 8080
    - matches:
        - path:
            type: PathPrefix
            value: /v1
      filters:
        - type: ExtensionRef
          extensionRef:
            group: traefik.io
            kind: Middleware
            name: security-headers
        - type: ExtensionRef
          extensionRef:
            group: traefik.io
            kind: Middleware
            name: rate-limit
        - type: ExtensionRef
          extensionRef:
            group: traefik.io
            kind: Middleware
            name: body-limit
        - type: ExtensionRef
          extensionRef:
            group: traefik.io
            kind: Middleware
            name: oauth-forward
      backendRefs:
        - name: persona-gateway
          port: 8080
    - matches:
        - path:
            type: PathPrefix
            value: /
      filters:
        - type: ExtensionRef
          extensionRef:
            group: traefik.io
            kind: Middleware
            name: security-headers
        - type: ExtensionRef
          extensionRef:
            group: traefik.io
            kind: Middleware
            name: rate-limit
        - type: ExtensionRef
          extensionRef:
            group: traefik.io
            kind: Middleware
            name: oauth-forward
      backendRefs:
        - name: persona-web
          port: 8080
