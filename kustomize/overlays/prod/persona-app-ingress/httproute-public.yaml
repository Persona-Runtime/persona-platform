# 인터넷(app.personaruntime.xyz) 전용 경로. 기존 httproute.yaml(persona-app, sectionName: http,
# hostname 없음)과 규칙은 동일하게 미러링하지만 별개 리소스로 둔다.
#
# hostnames는 HTTPRoute 전체에 걸린다 — 기존 httproute.yaml에 hostname을 넣으면 Serve(IP·tailnet
# 이름 접근)가 끊긴다. 그래서 https listener(sectionName: https)에 붙는 이 파일을 새로 만든다.
#
# 경로를 다시 쓰지 않는다(URLRewrite 필터 없음). Python API가 실제로 /v1/me, /v1/personas 를
# 받는다. 접두사를 떼면 404가 된다.
#
# Gate 4: 필터 목록의 순서가 곧 적용 순서다 — rate-limit이 oauth-forward보다 앞이라,
# 초당 요청이 너무 많으면 GitHub 로그인 여부를 묻기도 전에 429로 끊는다(oauth2-proxy를
# 불필요한 부하로부터 보호). /oauth2는 oauth2-proxy 콜백·정적 자산 경로라 인증
# 필터 없이 바로 통과시킨다(그 경로 자체가 로그인 흐름이라 자기 자신을 인증할 수
# 없다).
#
# Sync 분리(2026-09-19): persona-app-ingress 소속. Gateway 객체 자체(listener 선언)는
# persona-app에 남아 있다 — 한 Gateway를 두 Application이 나눠 관리할 수 없어서다.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: persona-app-public
  labels:
    app.kubernetes.io/part-of: persona-platform
    app.kubernetes.io/component: application
  annotations:
    # Middleware(-1) → HTTPRoute(1) — 이 Application엔 Gateway 객체가 없어 wave 0은
    # 비운다(내부 순서 고정, 2026-09-19).
    argocd.argoproj.io/sync-wave: "1"
spec:
  parentRefs:
    - name: persona-app
      sectionName: https
  hostnames:
    - app.personaruntime.xyz
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /oauth2
      filters:
        - type: ExtensionRef
          extensionRef:
            group: traefik.io
            kind: Middleware
            name: security-headers
      backendRefs:
        - name: oauth2-proxy
          namespace: persona-edge
          port: 4180
    - matches:
        - path:
            type: PathPrefix
            value: /v1
      filters:
        - type: ExtensionRef
          extensionRef:
            group: traefik.io
            kind: Middleware
            name: rate-limit
        - type: ExtensionRef
          extensionRef:
            group: traefik.io
            kind: Middleware
            name: oauth-forward
        - type: ExtensionRef
          extensionRef:
            group: traefik.io
            kind: Middleware
            name: body-limit
        - type: ExtensionRef
          extensionRef:
            group: traefik.io
            kind: Middleware
            name: security-headers
      backendRefs:
        - name: persona-gateway
          port: 8080
    - matches:
        - path:
            type: PathPrefix
            value: /
      filters:
        - type: ExtensionRef
          extensionRef:
            group: traefik.io
            kind: Middleware
            name: rate-limit
        - type: ExtensionRef
          extensionRef:
            group: traefik.io
            kind: Middleware
            name: oauth-forward
        - type: ExtensionRef
          extensionRef:
            group: traefik.io
            kind: Middleware
            name: security-headers
      backendRefs:
        - name: persona-web
          port: 8080
