# 인터넷(app.personaruntime.xyz) 전용 경로. 기존 httproute.yaml(persona-app, sectionName: http,
# hostname 없음)과 규칙은 동일하게 미러링하지만 별개 리소스로 둔다.
#
# hostnames는 HTTPRoute 전체에 걸린다 — 기존 httproute.yaml에 hostname을 넣으면 Serve(IP·tailnet
# 이름 접근)가 끊긴다. 그래서 https listener(sectionName: https)에 붙는 이 파일을 새로 만든다.
#
# 경로를 다시 쓰지 않는다(URLRewrite 필터 없음). Python API가 실제로 /v1/me, /v1/personas 를
# 받는다. 접두사를 떼면 404가 된다.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: persona-app-public
  labels:
    app.kubernetes.io/part-of: persona-platform
    app.kubernetes.io/component: application
spec:
  parentRefs:
    - name: persona-app
      sectionName: https
  hostnames:
    - app.personaruntime.xyz
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /v1
      backendRefs:
        - name: persona-gateway
          port: 8080
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: persona-web
          port: 8080
