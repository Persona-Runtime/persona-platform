apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# namespace는 bootstrap/namespaces/persona-app.yaml이 소유한다.
# Argo overlay에 Namespace를 넣지 않아, 앱 정리가 namespace 삭제로 번지지 않게 한다.
# 이 Application은 Gateway·Web 워크로드와 내부(Tailnet/Serve) 경로만 관리한다.
# public 진입(httproute-public.yaml·인터넷용 Middleware 4개)은 persona-app-ingress로,
# NetworkPolicy는 persona-app-netpol로 분리했다(Sync 통제, 2026-09-19) — 한 Application이
# 여러 종류의 변경을 한꺼번에 반영하지 않게 하려는 것. argocd/README.md 참고.
namespace: persona-app
resources:
  - ../../../base/persona-gateway
  - ../../../base/persona-web
  # persona-embedding은 이미지를 아직 GHCR에 push하지 않아 여기서 뺀다 — 이대로
  # Sync하면 자리표시자 digest 때문에 ImagePullBackOff로 Degraded가 된다. base는
  # 그대로 두고, push·digest 확정 뒤 이 줄만 되돌린다.
  - gateway.yaml
  - httproute.yaml
  - middlewares.yaml
