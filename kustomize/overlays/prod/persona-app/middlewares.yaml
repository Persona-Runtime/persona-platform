# Sync 분리(2026-09-19): 인터넷 진입용 Middleware 4개(oauth-forward·rate-limit·
# security-headers·body-limit)는 persona-app-ingress로 옮겼다 — httproute-public.yaml만
# 그것들을 참조하고, 내부 httproute.yaml(이 Application 소속)은 strip-auth-header만
# 참조하기 때문이다. ExtensionRef는 LocalObjectReference라 네임스페이스를 못 넘기므로
# 이 Middleware는 계속 HTTPRoute와 같은 persona-app 네임스페이스에 둔다.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: strip-auth-header
  labels:
    app.kubernetes.io/part-of: persona-platform
    app.kubernetes.io/component: application
  annotations:
    # Middleware(-1) → Gateway(0) → HTTPRoute(1). ExtensionRef가 이름으로 참조하므로
    # HTTPRoute보다 먼저 존재해야 한다.
    argocd.argoproj.io/sync-wave: "-1"
spec:
  headers:
    # 내부/Serve 경로(httproute.yaml)는 oauth-forward를 안 거친다 — 클라이언트가 이
    # 헤더를 직접 채워 보내도 gateway 코드가 신뢰하면 안 된다. gateway 쪽
    # PERSONA_FORWARD_AUTH_ENABLED 플래그(기본 꺼짐)가 1차 방어, 이 Middleware가
    # 그 경로에서 헤더 자체를 지우는 2차 방어다.
    customRequestHeaders:
      X-Auth-Request-User: ""
      X-Auth-Request-Email: ""
