apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# persona-data 네임스페이스의 NetworkPolicy만 관리한다. Sync 통제(2026-09-19)로
# persona-db(DB Cluster)에서 분리했다 — DB Sync는 §6 킬 스위치처럼 신중하게, 정책 변경은
# 별도 검증 지점(4-6)에서 다루기 위해서다. namespace는
# bootstrap/namespaces/persona-data.yaml이 소유한다.
namespace: persona-data
resources:
  - ../../../base/networkpolicy/persona-data
