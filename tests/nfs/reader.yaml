apiVersion: v1
kind: Pod
metadata:
  name: nfs-reader
  namespace: persona-nfs-test
spec:
  restartPolicy: Never
  activeDeadlineSeconds: 120
  terminationGracePeriodSeconds: 10
  automountServiceAccountToken: false
  nodeSelector:
    kubernetes.io/hostname: k8s-worker2
    kubernetes.io/arch: amd64
  securityContext:
    runAsNonRoot: true
    runAsUser: 10001
    runAsGroup: 10001
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: reader
      image: docker.io/library/busybox@sha256:7a3ebe5bfd1a4a19797d20b0c0bb39d44393e9a03fd852c0865b0f540d868df0
      command: [sh, -ec]
      args:
        - |
          cd /data
          test "$(cat sample.txt)" = persona-nfs-smoke-v1
          sha256sum -c sample.sha256
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop: [ALL]
      resources:
        requests: { cpu: 10m, memory: 16Mi }
        limits: { cpu: 100m, memory: 32Mi }
      volumeMounts:
        - name: data
          mountPath: /data
          readOnly: true
  volumes:
    - name: data
      persistentVolumeClaim:
        claimName: nfs-smoke-data
        readOnly: true
