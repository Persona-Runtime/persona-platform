apiVersion: v1
kind: Pod
metadata:
  name: nfs-writer
  namespace: persona-nfs-test
spec:
  restartPolicy: Never
  activeDeadlineSeconds: 120
  terminationGracePeriodSeconds: 10
  automountServiceAccountToken: false
  nodeSelector:
    kubernetes.io/hostname: k8s-worker1
    kubernetes.io/arch: amd64
  securityContext:
    runAsNonRoot: true
    runAsUser: 10001
    runAsGroup: 10001
    seccompProfile:
      type: RuntimeDefault
    # fsGroup에 의한 재귀 chown 대신 서버 디렉터리 소유권과 UID/GID를 맞춘다.
  containers:
    - name: writer
      image: docker.io/library/busybox@sha256:7a3ebe5bfd1a4a19797d20b0c0bb39d44393e9a03fd852c0865b0f540d868df0
      command: [sh, -ec]
      args:
        - |
          cd /data
          umask 007
          # 이전 실행의 파일을 덮어써 성공으로 오인하지 않는다.
          set -C
          printf 'persona-nfs-smoke-v1\n' > sample.txt
          sha256sum sample.txt > sample.sha256
          sync
          sha256sum -c sample.sha256
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop: [ALL]
      resources:
        requests: { cpu: 10m, memory: 16Mi }
        limits: { cpu: 100m, memory: 32Mi }
      volumeMounts:
        - name: data
          mountPath: /data
  volumes:
    - name: data
      persistentVolumeClaim:
        claimName: nfs-smoke-data
